<path d="M 470 720 L 1418 720 L 1430 732 L 1430 800 L 470 800 Z" fill="#FFFDF5" stroke="#B8892A" stroke-width="1.2"/>
<text x="480" y="738" font-size="12" font-weight="700" fill="#6E1A2C">La idea de esta arquitectura</text>
<text x="480" y="756" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">Por qué importa:</tspan> la VISTA solo conoce el CONTRATO (interfaces). El dominio real puede reemplazar a JuegoDePrueba</text>
<text x="480" y="772" font-size="11.5" fill="#1E1A17">sin tocar ninguna clase de la vista: solo cambia una línea en Main. Eso es el principio <tspan font-weight="700">DIP</tspan> (inversión de dependencias)</text>
<text x="480" y="788" font-size="11.5" fill="#1E1A17">y es lo que permite que cada integrante trabaje por separado.</text>
<text x="60" y="790" font-size="12.5" font-weight="400" fill="#1E1A17" text-anchor="start"><tspan font-weight="700">Quién hizo cada parte</tspan></text>
