<g class="caja" id="JuegoSokoban">
<rect x="50" y="121" width="128.421875" height="17" rx="8.5" fill="#F6EBCF" stroke="#B8892A" stroke-width="1"/><text x="58" y="133" font-size="10.5" font-weight="600" fill="#7A5A12">Originador (Originator)</text>
<rect x="50" y="140" width="260" height="267" rx="6" fill="#FCDDC7" stroke="#C8683A" stroke-width="1.4"/>
<text x="180.0" y="158" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1A17">JuegoSokoban</text>
<line x1="50" y1="166" x2="310" y2="166" stroke="#C8683A" stroke-width="1"/>
<text x="59.0" y="183.5" font-size="12" fill="#1E1A17" text-decoration="underline">- MAX_HISTORIAL: int = 15</text>
<text x="59.0" y="200.5" font-size="12" fill="#1E1A17" text-decoration="underline">- PASOS_POR_UNDO: int = 5</text>
<text x="59.0" y="217.5" font-size="12" fill="#1E1A17" text-decoration="underline">- MAX_UNDOS_CONSECUTIVOS: int = 3</text>
<text x="59.0" y="234.5" font-size="12" fill="#1E1A17">- historial: Deque&lt;RecuerdoNivel&gt;</text>
<text x="59.0" y="251.5" font-size="12" fill="#1E1A17">- maquinaDelTiempo: MaquinaDelTiempo</text>
<text x="59.0" y="268.5" font-size="12" fill="#1E1A17">- estado: EstadoNivel</text>
<text x="59.0" y="285.5" font-size="12" fill="#1E1A17">- movimientos: int</text>
<text x="59.0" y="302.5" font-size="12" fill="#1E1A17">- empujes: int</text>
<text x="59.0" y="319.5" font-size="12" fill="#1E1A17">- plutonio: int</text>
<text x="59.0" y="336.5" font-size="12" fill="#1E1A17">- viajes: int</text>
<line x1="50" y1="346" x2="310" y2="346" stroke="#C8683A" stroke-width="1"/>
<text x="59.0" y="363.5" font-size="12" fill="#1E1A17">- crearRecuerdo(): RecuerdoNivel</text>
<text x="59.0" y="380.5" font-size="12" fill="#1E1A17">- restaurar(recuerdo: RecuerdoNivel): void</text>
<text x="59.0" y="397.5" font-size="12" fill="#1E1A17">- olvidarPuntosDelFuturo(): void</text>
</g>
<g class="caja" id="RecuerdoNivel">
<rect x="600" y="141" width="120.796875" height="17" rx="8.5" fill="#F6EBCF" stroke="#B8892A" stroke-width="1"/><text x="608" y="153" font-size="10.5" font-weight="600" fill="#7A5A12">Recuerdo (Memento)</text>
<rect x="600" y="160" width="321" height="230" rx="6" fill="#D5E8D4" stroke="#82B366" stroke-width="1.4"/>
<text x="760.5" y="177" text-anchor="middle" font-size="10.5" fill="#6B6B6B">«Memento»</text>
<text x="760.5" y="192" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1A17">RecuerdoNivel</text>
<line x1="600" y1="200" x2="921" y2="200" stroke="#82B366" stroke-width="1"/>
<text x="609.0" y="217.5" font-size="12" fill="#1E1A17">- nivel: EstadoNivel</text>
<text x="609.0" y="234.5" font-size="12" fill="#1E1A17">- movimientos: int</text>
<text x="609.0" y="251.5" font-size="12" fill="#1E1A17">- empujes: int</text>
<text x="609.0" y="268.5" font-size="12" fill="#1E1A17">- plutonio: int</text>
<line x1="600" y1="278" x2="921" y2="278" stroke="#82B366" stroke-width="1"/>
<text x="609.0" y="295.5" font-size="12" fill="#1E1A17">~ RecuerdoNivel(nivel: EstadoNivel, movimientos: int,</text>
<text x="629.4" y="312.5" font-size="12" fill="#1E1A17">empujes: int, plutonio: int)</text>
<text x="609.0" y="329.5" font-size="12" fill="#1E1A17">~ nivel(): EstadoNivel</text>
<text x="609.0" y="346.5" font-size="12" fill="#1E1A17">~ movimientos(): int</text>
<text x="609.0" y="363.5" font-size="12" fill="#1E1A17">~ empujes(): int</text>
<text x="609.0" y="380.5" font-size="12" fill="#1E1A17">~ plutonio(): int</text>
</g>
<g class="caja" id="MaquinaDelTiempo">
<rect x="600" y="481" width="189.515625" height="17" rx="8.5" fill="#F6EBCF" stroke="#B8892A" stroke-width="1"/><text x="608" y="493" font-size="10.5" font-weight="600" fill="#7A5A12">Cuidador del DeLorean (Caretaker)</text>
<rect x="600" y="500" width="255" height="165" rx="6" fill="#D5E8D4" stroke="#82B366" stroke-width="1.4"/>
<text x="727.5" y="518" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1A17">MaquinaDelTiempo</text>
<line x1="600" y1="526" x2="855" y2="526" stroke="#82B366" stroke-width="1"/>
<text x="609.0" y="543.5" font-size="12" fill="#1E1A17" text-decoration="underline">- MAXIMO_PUNTOS: int = 10</text>
<text x="609.0" y="560.5" font-size="12" fill="#1E1A17">- puntos: Deque&lt;RecuerdoNivel&gt;</text>
<line x1="600" y1="570" x2="855" y2="570" stroke="#82B366" stroke-width="1"/>
<text x="609.0" y="587.5" font-size="12" fill="#1E1A17">+ guardar(recuerdo: RecuerdoNivel): void</text>
<text x="609.0" y="604.5" font-size="12" fill="#1E1A17">+ ultimo(): RecuerdoNivel</text>
<text x="609.0" y="621.5" font-size="12" fill="#1E1A17">+ descartarUltimo(): void</text>
<text x="609.0" y="638.5" font-size="12" fill="#1E1A17">+ cantidad(): int</text>
<text x="609.0" y="655.5" font-size="12" fill="#1E1A17">+ olvidarTodo(): void</text>
</g>
<g class="caja" id="EstadoNivel">
<rect x="1160" y="121" width="94.671875" height="17" rx="8.5" fill="#F6EBCF" stroke="#B8892A" stroke-width="1"/><text x="1168" y="133" font-size="10.5" font-weight="600" fill="#7A5A12">Lo que se copia</text>
<rect x="1160" y="140" width="351" height="165" rx="6" fill="#FCDDC7" stroke="#C8683A" stroke-width="1.4"/>
<text x="1335.5" y="158" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1A17">EstadoNivel</text>
<line x1="1160" y1="166" x2="1511" y2="166" stroke="#C8683A" stroke-width="1"/>
<text x="1169.0" y="183.5" font-size="12" fill="#1E1A17">- terreno: char[][]</text>
<text x="1169.0" y="200.5" font-size="12" fill="#1E1A17">- jugador: Jugador</text>
<text x="1169.0" y="217.5" font-size="12" fill="#1E1A17">- cajas: List&lt;Caja&gt;</text>
<line x1="1160" y1="227" x2="1511" y2="227" stroke="#C8683A" stroke-width="1"/>
<text x="1169.0" y="244.5" font-size="12" fill="#1E1A17">+ recogerPlutonio(p: Posicion): boolean</text>
<text x="1169.0" y="261.5" font-size="12" fill="#1E1A17">+ conservarPlutonioRecogido(presente: EstadoNivel): void</text>
<text x="1169.0" y="278.5" font-size="12" fill="#1E1A17">+ cajasEnDestino(): int</text>
<text x="1169.0" y="295.5" font-size="12" fill="#1E1A17">+ copiar(): EstadoNivel</text>
</g>
<text x="60" y="704" font-size="12.5" font-weight="400" fill="#1E1A17" text-anchor="start"><tspan font-weight="700">La pila historial</tspan> (máximo 15 recuerdos; el más nuevo a la derecha)</text>
<rect x="60" y="720" width="64" height="34" rx="4" fill="#F3FAF1" stroke="#82B366" stroke-width="1.2"/>
<text x="92.0" y="742" font-size="11" font-weight="400" fill="#1E1A17" text-anchor="middle">rec. 1</text>
<rect x="132" y="720" width="64" height="34" rx="4" fill="#F3FAF1" stroke="#82B366" stroke-width="1.2"/>
<text x="164.0" y="742" font-size="11" font-weight="400" fill="#1E1A17" text-anchor="middle">rec. 2</text>
<rect x="204" y="720" width="64" height="34" rx="4" fill="#F3FAF1" stroke="#82B366" stroke-width="1.2"/>
<text x="236.0" y="742" font-size="11" font-weight="400" fill="#1E1A17" text-anchor="middle">rec. 3</text>
<rect x="276" y="720" width="64" height="34" rx="4" fill="#F3FAF1" stroke="#82B366" stroke-width="1.2"/>
<text x="308.0" y="742" font-size="11" font-weight="400" fill="#1E1A17" text-anchor="middle">rec. 4</text>
<rect x="348" y="720" width="64" height="34" rx="4" fill="#F3FAF1" stroke="#82B366" stroke-width="1.2"/>
<text x="380.0" y="742" font-size="11" font-weight="400" fill="#1E1A17" text-anchor="middle">rec. 5</text>
<rect x="420" y="720" width="64" height="34" rx="4" fill="#F3FAF1" stroke="#82B366" stroke-width="1.2"/>
<text x="452.0" y="742" font-size="11" font-weight="400" fill="#1E1A17" text-anchor="middle">rec. 6</text>
<rect x="492" y="720" width="64" height="34" rx="4" fill="#F3FAF1" stroke="#82B366" stroke-width="1.2"/>
<text x="524.0" y="742" font-size="11" font-weight="400" fill="#1E1A17" text-anchor="middle">rec. 7</text>
<rect x="564" y="720" width="64" height="34" rx="4" fill="#F3FAF1" stroke="#82B366" stroke-width="1.2"/>
<text x="596.0" y="742" font-size="11" font-weight="400" fill="#1E1A17" text-anchor="middle">rec. 8</text>
<rect x="636" y="720" width="64" height="34" rx="4" fill="#F3FAF1" stroke="#82B366" stroke-width="1.2"/>
<text x="668.0" y="742" font-size="11" font-weight="400" fill="#1E1A17" text-anchor="middle">rec. 9</text>
<rect x="708" y="720" width="64" height="34" rx="4" fill="#F3FAF1" stroke="#82B366" stroke-width="1.2"/>
<text x="740.0" y="742" font-size="11" font-weight="400" fill="#1E1A17" text-anchor="middle">rec. 10</text>
<rect x="780" y="720" width="64" height="34" rx="4" fill="#D5E8D4" stroke="#82B366" stroke-width="1.2"/>
<text x="812.0" y="742" font-size="11" font-weight="400" fill="#1E1A17" text-anchor="middle">rec. 11</text>
<rect x="852" y="720" width="64" height="34" rx="4" fill="#D5E8D4" stroke="#82B366" stroke-width="1.2"/>
<text x="884.0" y="742" font-size="11" font-weight="400" fill="#1E1A17" text-anchor="middle">rec. 12</text>
<rect x="924" y="720" width="64" height="34" rx="4" fill="#D5E8D4" stroke="#82B366" stroke-width="1.2"/>
<text x="956.0" y="742" font-size="11" font-weight="400" fill="#1E1A17" text-anchor="middle">rec. 13</text>
<rect x="996" y="720" width="64" height="34" rx="4" fill="#D5E8D4" stroke="#82B366" stroke-width="1.2"/>
<text x="1028.0" y="742" font-size="11" font-weight="400" fill="#1E1A17" text-anchor="middle">rec. 14</text>
<rect x="1068" y="720" width="64" height="34" rx="4" fill="#D5E8D4" stroke="#82B366" stroke-width="1.2"/>
<text x="1100.0" y="742" font-size="11" font-weight="400" fill="#1E1A17" text-anchor="middle">rec. 15</text>
<path d="M 780 762 L 780 770 L 1132 770 L 1132 762" fill="none" stroke="#6E1A2C" stroke-width="1.4"/>
<text x="956.0" y="788" font-size="11.5" font-weight="600" fill="#6E1A2C" text-anchor="middle">un deshacer saca estos 5 y vuelve al «rec. 11»</text>
<path d="M 60 762 L 60 770 L 124 770 L 124 762" fill="none" stroke="#8A7F76" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="60" y="788" font-size="11" font-weight="400" fill="#8A7F76" text-anchor="start" font-style="italic">cuando llega el 16, sale el 1 (el más viejo)</text>
<path d="M 50 850 L 798 850 L 810 862 L 810 994 L 50 994 Z" fill="#FFFDF5" stroke="#B8892A" stroke-width="1.2"/>
<text x="60" y="868" font-size="12" font-weight="700" fill="#6E1A2C">Las reglas: 15 / 5 / 3 y el DeLorean</text>
<text x="60" y="886" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">1</tspan> mover(): antes de mover hace crearRecuerdo() (copia del nivel y de los contadores).</text>
<text x="60" y="902" font-size="11.5" fill="#1E1A17">     Si el movimiento se hizo, lo apila; si pasa de 15, borra el más viejo.</text>
<text x="60" y="918" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">deshacer():</tspan> saca hasta 5, restaura el último que sacó; máximo 3 seguidos.</text>
<text x="60" y="934" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">2</tspan> Puntos en el tiempo: al iniciar el nivel y cada vez que una caja llega a destino,</text>
<text x="60" y="950" font-size="11.5" fill="#1E1A17">     guarda un recuerdo en la MaquinaDelTiempo (máximo 10).</text>
<text x="60" y="966" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">DeLorean (tecla T):</tspan> cuesta 1 plutonio, vuelve al último punto y borra el historial.</text>
<text x="60" y="982" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">3</tspan> La máquina guarda los recuerdos pero no puede leerlos (está en otro paquete).</text>
<path d="M 860 850 L 1588 850 L 1600 862 L 1600 978 L 860 978 Z" fill="#FFFDF5" stroke="#B8892A" stroke-width="1.2"/>
<text x="870" y="868" font-size="12" font-weight="700" fill="#6E1A2C">Por qué es un Memento (Martín)</text>
<text x="870" y="886" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">Originador:</tspan> JuegoSokoban crea el recuerdo (crearRecuerdo) y lo restaura (restaurar).</text>
<text x="870" y="902" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">Memento:</tspan> RecuerdoNivel. Su constructor y sus lectores son de paquete (~):</text>
<text x="870" y="918" font-size="11.5" fill="#1E1A17">     solo sokoban.modelo puede crearlo y abrirlo. nivel() devuelve una copia.</text>
<text x="870" y="934" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">Cuidadores:</tspan> el historial del deshacer y MaquinaDelTiempo (sokoban.modelo.tiempo),</text>
<text x="870" y="950" font-size="11.5" fill="#1E1A17">     que guardan los recuerdos sin poder mirarlos adentro.</text>
<text x="870" y="966" font-size="11.5" fill="#1E1A17">Deshacer descarta los puntos «del futuro» (olvidarPuntosDelFuturo).</text>
</svg>