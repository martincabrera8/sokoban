<text x="1100.0" y="951" font-size="11" font-weight="400" fill="#1E1A17" text-anchor="middle">rec. 15</text>
<path d="M 780 971 L 780 979 L 1132 979 L 1132 971" fill="none" stroke="#6E1A2C" stroke-width="1.4"/>
<text x="956.0" y="997" font-size="11.5" font-weight="600" fill="#6E1A2C" text-anchor="middle">un deshacer saca estos 5 y vuelve al «rec. 11»</text>
<path d="M 60 971 L 60 979 L 124 979 L 124 971" fill="none" stroke="#8A7F76" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="60" y="997" font-size="11" font-weight="400" fill="#8A7F76" text-anchor="start" font-style="italic">cuando llega el 16, sale el 1 (el más viejo)</text>
<path d="M 50 1023 L 798 1023 L 810 1035 L 810 1167 L 50 1167 Z" fill="#FFFDF5" stroke="#B8892A" stroke-width="1.2"/>
<text x="60" y="1041" font-size="12" font-weight="700" fill="#6E1A2C">Las reglas: 15 / 5 / 3 y el DeLorean</text>
<text x="60" y="1059" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">1</tspan> mover(): antes de mover, JuegoSokoban pide nivel.crearRecuerdo(). Si el movimiento</text>
<text x="60" y="1075" font-size="11.5" fill="#1E1A17">     se hizo, lo guarda en el historial (si pasa de 15, se borra el más viejo).</text>
<text x="60" y="1091" font-size="11.5" fill="#1E1A17">     <tspan font-weight="700">deshacer():</tspan> el historial saca hasta 5 y devuelve el último; máximo 3 seguidos.</text>
<text x="60" y="1107" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">2</tspan> Puntos en el tiempo: al iniciar el nivel y cada vez que una caja llega a destino</text>
<text x="60" y="1123" font-size="11.5" fill="#1E1A17">     se guarda un Punto (movimiento + recuerdo) en la MaquinaDelTiempo (máximo 10).</text>
<text x="60" y="1139" font-size="11.5" fill="#1E1A17">     <tspan font-weight="700">DeLorean (tecla T):</tspan> cuesta 1 plutonio; volverAntesDe(movimientos) da el punto</text>
<text x="60" y="1155" font-size="11.5" fill="#1E1A17">     anterior, nivel.viajarA(punto) y se borra el historial.</text>
<path d="M 860 1023 L 1588 1023 L 1600 1035 L 1600 1167 L 860 1167 Z" fill="#FFFDF5" stroke="#B8892A" stroke-width="1.2"/>
<text x="870" y="1041" font-size="12" font-weight="700" fill="#6E1A2C">Por qué es un Memento (Martín)</text>
<text x="870" y="1059" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">Originador:</tspan> EstadoNivel crea el recuerdo (crearRecuerdo) y lo restaura (restaurar, viajarA).</text>
<text x="870" y="1075" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">3 Memento:</tspan> RecuerdoNivel (final). Su constructor y sus lectores son de paquete (~):</text>
<text x="870" y="1091" font-size="11.5" fill="#1E1A17">     solo sokoban.modelo puede crearlo y abrirlo. Guarda copias, no el nivel vivo.</text>
<text x="870" y="1107" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">Cuidadores:</tspan> HistorialDeshacer y MaquinaDelTiempo (sokoban.modelo.tiempo)</text>
<text x="870" y="1123" font-size="11.5" fill="#1E1A17">     guardan los recuerdos sin poder mirarlos adentro.</text>
