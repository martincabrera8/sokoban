<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 1090" width="1640" height="1090" font-family="Inter, Arial, sans-serif">
<style>text{white-space:pre}</style>
<rect width="1640" height="1090" fill="#FFFFFF"/>
<text x="30" y="40" font-size="22" font-weight="700" fill="#6E1A2C">Deshacer y DeLorean: el patrón Memento</text>
<text x="30" y="62" font-size="12.5" fill="#6B6B6B">Antes de cada movimiento y en cada «punto en el tiempo» se guarda un recuerdo del nivel. Deshacer y viajar en el tiempo es volver a un recuerdo.</text>
