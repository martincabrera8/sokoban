<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 840" width="1600" height="840" font-family="Inter, Arial, sans-serif">
<style>text{white-space:pre}</style>
<rect width="1600" height="840" fill="#FFFFFF"/>
<text x="30" y="40" font-size="22" font-weight="700" fill="#6E1A2C">Deshacer con fotos del nivel (idea del patrón Memento)</text>
<text x="30" y="62" font-size="12.5" fill="#6B6B6B">Antes de cada movimiento se guarda una copia completa del nivel. Deshacer es volver a una copia anterior.</text>
<path d="M 275.0 220.5 L 560.0 220.5" fill="none" stroke="#1E1A17" stroke-width="1.6"/>
<polyline points="549.0,214.5 560.0,220.5 549.0,226.5" fill="none" stroke="#1E1A17" stroke-width="1.6"/>
<polygon points="275.0,220.5 285.0,226.5 295.0,220.5 285.0,214.5" fill="#1E1A17" stroke="#1E1A17" stroke-width="1.4"/>
<rect x="391.984375" y="211.5" width="51.03125" height="17" rx="4" fill="#FFFFFF" fill-opacity="0.95"/><text x="417.5" y="224.0" font-size="10.5" text-anchor="middle" fill="#3A332E">historial</text><circle cx="382.984375" cy="220.5" r="8.5" fill="#B8892A"/><text x="382.984375" y="224.0" font-size="10" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
<text x="530" y="212.5" font-size="11.5" font-weight="600" fill="#1E1A17" text-anchor="middle">0..15</text>
<path d="M 800.0 220.5 L 1040.0 220.5" fill="none" stroke="#1E1A17" stroke-width="1.6"/>
<polyline points="1029.0,214.5 1040.0,220.5 1029.0,226.5" fill="none" stroke="#1E1A17" stroke-width="1.6"/>
<rect x="889.796875" y="211.5" width="60.40625" height="17" rx="4" fill="#FFFFFF" fill-opacity="0.95"/><text x="920.0" y="224.0" font-size="10.5" text-anchor="middle" fill="#3A332E">una copia</text><circle cx="880.796875" cy="220.5" r="8.5" fill="#B8892A"/><text x="880.796875" y="224.0" font-size="10" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
<text x="1024" y="214.5" font-size="11.5" font-weight="600" fill="#1E1A17" text-anchor="middle">1</text>
<path d="M 275.0 343.0 L 1123.0 343.0 L 1123.0 271.0" fill="none" stroke="#1E1A17" stroke-width="1.6"/>
<polyline points="1117.0,282.0 1123.0,271.0 1129.0,282.0" fill="none" stroke="#1E1A17" stroke-width="1.6"/>
<rect x="740.2890625" y="334" width="119.421875" height="17" rx="4" fill="#FFFFFF" fill-opacity="0.95"/><text x="800" y="346.5" font-size="10.5" text-anchor="middle" fill="#3A332E">estado: el nivel actual</text>
<text x="1135.0" y="281" font-size="11.5" font-weight="600" fill="#1E1A17" text-anchor="middle">1</text>
<g class="caja" id="JuegoSokoban">
<rect x="50" y="121" width="120.46875" height="17" rx="8.5" fill="#F6EBCF" stroke="#B8892A" stroke-width="1"/><text x="58" y="133" font-size="10.5" font-weight="600" fill="#7A5A12">Cuidador (Caretaker)</text>
<rect x="50" y="140" width="225" height="233" rx="6" fill="#FCDDC7" stroke="#C8683A" stroke-width="1.4"/>
<text x="162.5" y="158" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1A17">JuegoSokoban</text>
<line x1="50" y1="166" x2="275" y2="166" stroke="#C8683A" stroke-width="1"/>
<text x="59.0" y="183.5" font-size="12" fill="#1E1A17" text-decoration="underline">- MAX_HISTORIAL: int</text>
<text x="59.0" y="200.5" font-size="12" fill="#1E1A17" text-decoration="underline">- PASOS_POR_UNDO: int</text>
<text x="59.0" y="217.5" font-size="12" fill="#1E1A17" text-decoration="underline">- MAX_UNDOS_CONSECUTIVOS: int</text>
<text x="59.0" y="234.5" font-size="12" fill="#1E1A17">- historial: Deque&lt;Foto&gt;</text>
<text x="59.0" y="251.5" font-size="12" fill="#1E1A17">- estado: EstadoNivel</text>
<text x="59.0" y="268.5" font-size="12" fill="#1E1A17">- movimientos: int</text>
<text x="59.0" y="285.5" font-size="12" fill="#1E1A17">- empujes: int</text>
<text x="59.0" y="302.5" font-size="12" fill="#1E1A17">- undosUsados: int</text>
<text x="59.0" y="319.5" font-size="12" fill="#1E1A17">- undosConsecutivos: int</text>
<line x1="50" y1="329" x2="275" y2="329" stroke="#C8683A" stroke-width="1"/>
<text x="59.0" y="346.5" font-size="12" fill="#1E1A17">+ mover(direccion: Direccion): void</text>
<text x="59.0" y="363.5" font-size="12" fill="#1E1A17">+ deshacer(): void</text>
</g>
<g class="caja" id="Foto">
<rect x="560" y="151" width="120.796875" height="17" rx="8.5" fill="#F6EBCF" stroke="#B8892A" stroke-width="1"/><text x="568" y="163" font-size="10.5" font-weight="600" fill="#7A5A12">Recuerdo (Memento)</text>
<rect x="560" y="170" width="240" height="101" rx="6" fill="#FCDDC7" stroke="#C8683A" stroke-width="1.4"/>
<text x="680.0" y="187" text-anchor="middle" font-size="10.5" fill="#6B6B6B">«record · privado, dentro de JuegoSokoban»</text>
<text x="680.0" y="202" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1A17">Foto</text>
<line x1="560" y1="210" x2="800" y2="210" stroke="#C8683A" stroke-width="1"/>
<text x="569.0" y="227.5" font-size="12" fill="#1E1A17">- estado: EstadoNivel</text>
<text x="569.0" y="244.5" font-size="12" fill="#1E1A17">- movimientos: int</text>
<text x="569.0" y="261.5" font-size="12" fill="#1E1A17">- empujes: int</text>
</g>
<g class="caja" id="EstadoNivel">
<rect x="1040" y="121" width="128.421875" height="17" rx="8.5" fill="#F6EBCF" stroke="#B8892A" stroke-width="1"/><text x="1048" y="133" font-size="10.5" font-weight="600" fill="#7A5A12">Originador (Originator)</text>
<rect x="1040" y="140" width="166" height="131" rx="6" fill="#FCDDC7" stroke="#C8683A" stroke-width="1.4"/>
<text x="1123.0" y="158" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1A17">EstadoNivel</text>
<line x1="1040" y1="166" x2="1206" y2="166" stroke="#C8683A" stroke-width="1"/>
<text x="1049.0" y="183.5" font-size="12" fill="#1E1A17">- terreno: char[][]</text>
<text x="1049.0" y="200.5" font-size="12" fill="#1E1A17">- jugador: Jugador</text>
<text x="1049.0" y="217.5" font-size="12" fill="#1E1A17">- cajas: List&lt;Caja&gt;</text>
<line x1="1040" y1="227" x2="1206" y2="227" stroke="#C8683A" stroke-width="1"/>
<text x="1049.0" y="244.5" font-size="12" fill="#1E1A17">- copiarTerreno(): char[][]</text>
<text x="1049.0" y="261.5" font-size="12" fill="#1E1A17">+ copiar(): EstadoNivel</text>
</g>
<text x="60" y="454" font-size="12.5" font-weight="400" fill="#1E1A17" text-anchor="start"><tspan font-weight="700">La pila historial</tspan> (máximo 15 fotos; la más nueva a la derecha)</text>
<rect x="60" y="470" width="64" height="34" rx="4" fill="#FEF7F1" stroke="#C8683A" stroke-width="1.2"/>
<text x="92.0" y="492" font-size="11" font-weight="400" fill="#1E1A17" text-anchor="middle">foto 1</text>
<rect x="132" y="470" width="64" height="34" rx="4" fill="#FEF7F1" stroke="#C8683A" stroke-width="1.2"/>
<text x="164.0" y="492" font-size="11" font-weight="400" fill="#1E1A17" text-anchor="middle">foto 2</text>
<rect x="204" y="470" width="64" height="34" rx="4" fill="#FEF7F1" stroke="#C8683A" stroke-width="1.2"/>
<text x="236.0" y="492" font-size="11" font-weight="400" fill="#1E1A17" text-anchor="middle">foto 3</text>
<rect x="276" y="470" width="64" height="34" rx="4" fill="#FEF7F1" stroke="#C8683A" stroke-width="1.2"/>
<text x="308.0" y="492" font-size="11" font-weight="400" fill="#1E1A17" text-anchor="middle">foto 4</text>
<rect x="348" y="470" width="64" height="34" rx="4" fill="#FEF7F1" stroke="#C8683A" stroke-width="1.2"/>
<text x="380.0" y="492" font-size="11" font-weight="400" fill="#1E1A17" text-anchor="middle">foto 5</text>
<rect x="420" y="470" width="64" height="34" rx="4" fill="#FEF7F1" stroke="#C8683A" stroke-width="1.2"/>
<text x="452.0" y="492" font-size="11" font-weight="400" fill="#1E1A17" text-anchor="middle">foto 6</text>
<rect x="492" y="470" width="64" height="34" rx="4" fill="#FEF7F1" stroke="#C8683A" stroke-width="1.2"/>
<text x="524.0" y="492" font-size="11" font-weight="400" fill="#1E1A17" text-anchor="middle">foto 7</text>
<rect x="564" y="470" width="64" height="34" rx="4" fill="#FEF7F1" stroke="#C8683A" stroke-width="1.2"/>
<text x="596.0" y="492" font-size="11" font-weight="400" fill="#1E1A17" text-anchor="middle">foto 8</text>
<rect x="636" y="470" width="64" height="34" rx="4" fill="#FEF7F1" stroke="#C8683A" stroke-width="1.2"/>
<text x="668.0" y="492" font-size="11" font-weight="400" fill="#1E1A17" text-anchor="middle">foto 9</text>
<rect x="708" y="470" width="64" height="34" rx="4" fill="#FEF7F1" stroke="#C8683A" stroke-width="1.2"/>
<text x="740.0" y="492" font-size="11" font-weight="400" fill="#1E1A17" text-anchor="middle">foto 10</text>
<rect x="780" y="470" width="64" height="34" rx="4" fill="#FCDDC7" stroke="#C8683A" stroke-width="1.2"/>
<text x="812.0" y="492" font-size="11" font-weight="400" fill="#1E1A17" text-anchor="middle">foto 11</text>
<rect x="852" y="470" width="64" height="34" rx="4" fill="#FCDDC7" stroke="#C8683A" stroke-width="1.2"/>
<text x="884.0" y="492" font-size="11" font-weight="400" fill="#1E1A17" text-anchor="middle">foto 12</text>
<rect x="924" y="470" width="64" height="34" rx="4" fill="#FCDDC7" stroke="#C8683A" stroke-width="1.2"/>
<text x="956.0" y="492" font-size="11" font-weight="400" fill="#1E1A17" text-anchor="middle">foto 13</text>
<rect x="996" y="470" width="64" height="34" rx="4" fill="#FCDDC7" stroke="#C8683A" stroke-width="1.2"/>
<text x="1028.0" y="492" font-size="11" font-weight="400" fill="#1E1A17" text-anchor="middle">foto 14</text>
<rect x="1068" y="470" width="64" height="34" rx="4" fill="#FCDDC7" stroke="#C8683A" stroke-width="1.2"/>
<text x="1100.0" y="492" font-size="11" font-weight="400" fill="#1E1A17" text-anchor="middle">foto 15</text>
<path d="M 780 512 L 780 520 L 1132 520 L 1132 512" fill="none" stroke="#6E1A2C" stroke-width="1.4"/>
<text x="956.0" y="538" font-size="11.5" font-weight="600" fill="#6E1A2C" text-anchor="middle">un deshacer saca estas 5 y vuelve a la «foto 11»</text>
<path d="M 60 512 L 60 520 L 124 520 L 124 512" fill="none" stroke="#8A7F76" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="60" y="538" font-size="11" font-weight="400" fill="#8A7F76" text-anchor="start" font-style="italic">cuando llega la foto 16, sale la foto 1 (la más vieja)</text>
<path d="M 50 600 L 738 600 L 750 612 L 750 728 L 50 728 Z" fill="#FFFDF5" stroke="#B8892A" stroke-width="1.2"/>
<text x="60" y="618" font-size="12" font-weight="700" fill="#6E1A2C">Las reglas de la consigna: 15 / 5 / 3</text>
<text x="60" y="636" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">1</tspan> mover(): antes de mover arma new Foto(estado.copiar(), movimientos, empujes).</text>
<text x="60" y="652" font-size="11.5" fill="#1E1A17">     Si el movimiento se hizo, la apila; si pasa de 15, borra la más vieja.</text>
<text x="60" y="668" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">2</tspan> La Foto guarda una copia completa del EstadoNivel (terreno, jugador, cajas).</text>
<text x="60" y="684" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">deshacer():</tspan> saca hasta 5 fotos, restaura la última que sacó y suma 1 a</text>
<text x="60" y="700" font-size="11.5" fill="#1E1A17">     undosUsados. Máximo 3 deshacer seguidos: el contador vuelve a 0 al mover.</text>
<text x="60" y="716" font-size="11.5" fill="#1E1A17">No hace nada si el historial está vacío o el nivel ya se completó.</text>
<path d="M 800 600 L 1538 600 L 1550 612 L 1550 712 L 800 712 Z" fill="#FFFDF5" stroke="#B8892A" stroke-width="1.2"/>
<text x="810" y="618" font-size="12" font-weight="700" fill="#6E1A2C">¿Es un Memento?</text>
<text x="810" y="636" font-size="11.5" fill="#1E1A17">En el Memento del libro, el originador crea el recuerdo y lo restaura</text>
<text x="810" y="652" font-size="11.5" fill="#1E1A17">(crearMemento / restaurar) y el cuidador solo lo guarda sin mirarlo.</text>
<text x="810" y="668" font-size="11.5" fill="#1E1A17">Acá JuegoSokoban arma la Foto con estado.copiar() y la restaura con</text>
<text x="810" y="684" font-size="11.5" fill="#1E1A17">estado = foto.estado(). Funciona igual: es una <tspan font-weight="700">instantánea del estado</tspan>.</text>
<text x="810" y="700" font-size="11.5" fill="#1E1A17">Para presentarlo como Memento conviene nombrarlo así en el informe.</text>
</svg>