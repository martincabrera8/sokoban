<g class="caja" id="Imagenes">
<rect x="520" y="181" width="62.421875" height="17" rx="8.5" fill="#F6EBCF" stroke="#B8892A" stroke-width="1"/><text x="528" y="193" font-size="10.5" font-weight="600" fill="#7A5A12">Singleton</text>
<rect x="520" y="200" width="248" height="213" rx="6" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.4"/>
<text x="644.0" y="217" text-anchor="middle" font-size="10.5" fill="#6B6B6B">«Singleton»</text>
<text x="644.0" y="232" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1A17">Imagenes</text>
<line x1="520" y1="240" x2="768" y2="240" stroke="#6C8EBF" stroke-width="1"/>
<text x="529.0" y="257.5" font-size="12" fill="#1E1A17" text-decoration="underline">- CARPETA: String</text>
<text x="529.0" y="274.5" font-size="12" fill="#1E1A17" text-decoration="underline">- instancia: Imagenes</text>
<text x="529.0" y="291.5" font-size="12" fill="#1E1A17">- cache: Map&lt;String, Image&gt;</text>
<line x1="520" y1="301" x2="768" y2="301" stroke="#6C8EBF" stroke-width="1"/>
<text x="529.0" y="318.5" font-size="12" fill="#1E1A17">- Imagenes()</text>
<text x="529.0" y="335.5" font-size="12" fill="#1E1A17" text-decoration="underline">+ obtenerInstancia(): Imagenes</text>
<text x="529.0" y="352.5" font-size="12" fill="#1E1A17">+ obtener(ruta: String): Image</text>
<text x="529.0" y="369.5" font-size="12" fill="#1E1A17">+ dibujarFondo(g: Graphics, ruta: String,</text>
<text x="549.4" y="386.5" font-size="12" fill="#1E1A17">ancho: int, alto: int): void</text>
<text x="529.0" y="403.5" font-size="12" fill="#1E1A17">- cargar(ruta: String): Image</text>
</g>
<g class="caja" id="Assets">
<rect x="1060" y="220" width="189" height="152" rx="6" fill="#D5E8D4" stroke="#82B366" stroke-width="1.4"/>
<text x="1154.5" y="237" text-anchor="middle" font-size="10.5" fill="#6B6B6B">«carpeta de recursos»</text>
<text x="1154.5" y="252" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1A17">assets/  (101 PNG)</text>
<line x1="1060" y1="260" x2="1249" y2="260" stroke="#82B366" stroke-width="1"/>
<text x="1069.0" y="277.5" font-size="12" fill="#1E1A17">characters/    4   (se usan 4)</text>
<text x="1069.0" y="294.5" font-size="12" fill="#1E1A17">backgrounds/   3   (se usan 3)</text>
<text x="1069.0" y="311.5" font-size="12" fill="#1E1A17">boxes/         8   (se usan 3)</text>
<text x="1069.0" y="328.5" font-size="12" fill="#1E1A17">goals/         3   (se usan 2)</text>
<text x="1069.0" y="345.5" font-size="12" fill="#1E1A17">tiles/        69   (se usan 10)</text>
<text x="1069.0" y="362.5" font-size="12" fill="#1E1A17">ui/           17   (se usan 6)</text>
</g>
<path d="M 520 500 L 1288 500 L 1300 512 L 1300 612 L 520 612 Z" fill="#FFFDF5" stroke="#B8892A" stroke-width="1.2"/>
<text x="530" y="518" font-size="12" font-weight="700" fill="#6E1A2C">Las 3 piezas que tiene que tener un Singleton</text>
<text x="530" y="536" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">private static Imagenes instancia;          // 1. la única instancia, guardada en la clase</text>
<text x="530" y="552" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">private Imagenes() { }                       // 2. constructor privado: nadie más puede hacer new</text>
<text x="530" y="568" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">public static Imagenes obtenerInstancia() {  // 3. punto de acceso global</text>
<text x="530" y="584" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">    if (instancia == null) instancia = new Imagenes();   // se crea la primera vez que se pide</text>
<text x="530" y="600" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">    return instancia; }</text>
</svg>