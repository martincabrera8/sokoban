<line x1="40" y1="520" x2="1320" y2="520" stroke="#D9CBAE" stroke-width="1.2" stroke-dasharray="4 4"/>
<path d="M 50 930 L 1298 930 L 1310 942 L 1310 1042 L 50 1042 Z" fill="#FFFDF5" stroke="#B8892A" stroke-width="1.2"/>
<text x="60" y="948" font-size="12" font-weight="700" fill="#6E1A2C">Las 3 piezas que tiene que tener un Singleton (las dos clases las tienen)</text>
<text x="60" y="966" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">private static Imagenes instancia;          // 1. la única instancia, guardada en la clase   (Sonidos: igual)</text>
<text x="60" y="982" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">private Imagenes() { }                      // 2. constructor privado: nadie más puede hacer new</text>
<text x="60" y="998" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">public static Imagenes obtenerInstancia() {  // 3. punto de acceso global</text>
<text x="60" y="1014" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">    if (instancia == null) instancia = new Imagenes();   // se crea la primera vez que se pide</text>
<text x="60" y="1030" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">    return instancia; }</text>
</svg>