<line x1="40" y1="420" x2="1200" y2="420" stroke="#D9CBAE" stroke-width="1.2" stroke-dasharray="4 4"/>
<path d="M 50 790 L 1188 790 L 1200 802 L 1200 902 L 50 902 Z" fill="#FFFDF5" stroke="#B8892A" stroke-width="1.2"/>
<text x="60" y="808" font-size="12" font-weight="700" fill="#6E1A2C">Las 3 piezas de un Singleton (las dos clases las tienen; además son final)</text>
<text x="60" y="826" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">private static Imagenes instancia;          // 1. la única instancia, guardada en la clase   (Sonidos: igual)</text>
<text x="60" y="842" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">private Imagenes() { }                      // 2. constructor privado: nadie más puede hacer new</text>
<text x="60" y="858" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">public static Imagenes obtenerInstancia() {  // 3. punto de acceso global</text>
<text x="60" y="874" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">    if (instancia == null) instancia = new Imagenes();   // se crea la primera vez que se pide</text>
<text x="60" y="890" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">    return instancia; }</text>
</svg>