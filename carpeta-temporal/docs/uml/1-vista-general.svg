<g class="caja" id="Main">
<rect x="600" y="90" width="330" height="84" rx="6" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.4"/>
<text x="765.0" y="107" text-anchor="middle" font-size="10.5" fill="#6B6B6B">«paquete»</text>
<text x="765.0" y="122" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1A17">sokoban · arranque</text>
<line x1="600" y1="130" x2="930" y2="130" stroke="#6C8EBF" stroke-width="1"/>
<text x="609.0" y="147.5" font-size="12" fill="#1E1A17">Main: crea las piezas y las conecta</text>
<text x="609.0" y="164.5" font-size="12" fill="#1E1A17">new JuegoConSonido(new JuegoSokoban())</text>
</g>
<g class="caja" id="Swing">
<rect x="60" y="90" width="230" height="67" rx="6" fill="#FFFFFF" stroke="#9E9E9E" stroke-width="1.4"/>
<text x="175.0" y="107" text-anchor="middle" font-size="10.5" fill="#6B6B6B">«biblioteca»</text>
<text x="175.0" y="122" text-anchor="middle" font-size="14" font-weight="600" fill="#6B6B6B">javax.swing (Java)</text>
<line x1="60" y1="130" x2="290" y2="130" stroke="#9E9E9E" stroke-width="1"/>
<text x="69.0" y="147.5" font-size="12" fill="#6B6B6B">JFrame, JPanel, JDialog, JButton…</text>
</g>
<g class="caja" id="Vista">
<rect x="60" y="290" width="330" height="186" rx="6" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.4"/>
<text x="225.0" y="307" text-anchor="middle" font-size="10.5" fill="#6B6B6B">«paquete · Luca»</text>
<text x="225.0" y="322" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1A17">VISTA · sokoban.vista</text>
<line x1="60" y1="330" x2="390" y2="330" stroke="#6C8EBF" stroke-width="1"/>
<text x="69.0" y="347.5" font-size="12" fill="#1E1A17">VentanaPrincipal (ventana)</text>
<text x="69.0" y="364.5" font-size="12" fill="#1E1A17">MenuPrincipal (menú)</text>
<text x="69.0" y="381.5" font-size="12" fill="#1E1A17">PantallaJuego (partida y teclado)</text>
<text x="69.0" y="398.5" font-size="12" fill="#1E1A17">PanelHUD (indicadores y botones)</text>
<text x="69.0" y="415.5" font-size="12" fill="#1E1A17">PanelTablero (dibuja el tablero)</text>
<text x="69.0" y="432.5" font-size="12" fill="#1E1A17">Cartel (pausa / resultado)</text>
<text x="69.0" y="449.5" font-size="12" fill="#1E1A17">Imagenes (caché de imágenes)  ← Singleton</text>
<text x="69.0" y="466.5" font-size="12" fill="#1E1A17">Epoca (estilo por época) · integración</text>
</g>
<g class="caja" id="Contrato">
<rect x="600" y="330" width="330" height="118" rx="6" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.4"/>
<text x="765.0" y="347" text-anchor="middle" font-size="10.5" fill="#6B6B6B">«paquete · Luca»</text>
<text x="765.0" y="362" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1A17">CONTRATO · sokoban.modelo</text>
<line x1="600" y1="370" x2="930" y2="370" stroke="#6C8EBF" stroke-width="1"/>
<text x="609.0" y="387.5" font-size="12" fill="#1E1A17">Juego  ← Facade + sujeto del Observer</text>
<text x="609.0" y="404.5" font-size="12" fill="#1E1A17">ObservadorJuego  ← Observer</text>
<text x="609.0" y="421.5" font-size="12" fill="#1E1A17">EstadoJuego  ← DTO (record)</text>
<text x="609.0" y="438.5" font-size="12" fill="#1E1A17">Direccion  ← enum</text>
</g>
<g class="caja" id="Sonido">
<rect x="1130" y="290" width="410" height="135" rx="6" fill="#EEDDF3" stroke="#A0559F" stroke-width="1.4"/>
<text x="1335.0" y="307" text-anchor="middle" font-size="10.5" fill="#6B6B6B">«paquete · Mora»</text>
<text x="1335.0" y="322" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1A17">SONIDO · sokoban.sonido</text>
<line x1="1130" y1="330" x2="1540" y2="330" stroke="#A0559F" stroke-width="1"/>
<text x="1139.0" y="347.5" font-size="12" fill="#1E1A17">JuegoConSonido  ← Decorator de Juego</text>
<text x="1139.0" y="364.5" font-size="12" fill="#1E1A17">Sonidos  ← Singleton + Facade de javax.sound</text>
<text x="1139.0" y="381.5" font-size="12" fill="#1E1A17">EstadoSonido, SonidoActivado, SonidoSilenciado  ← State</text>
<text x="1139.0" y="398.5" font-size="12" fill="#1E1A17">Sonido (14 efectos), SonidosDeInterfaz (clics, M)</text>
<text x="1139.0" y="415.5" font-size="12" fill="#1E1A17">assets/sonidos/: 14 archivos .wav propios</text>
</g>
<g class="caja" id="Dominio">
<rect x="1130" y="540" width="410" height="169" rx="6" fill="#FCDDC7" stroke="#C8683A" stroke-width="1.4"/>
<text x="1335.0" y="557" text-anchor="middle" font-size="10.5" fill="#6B6B6B">«paquete · Pedro y Lucía»</text>
<text x="1335.0" y="572" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1A17">DOMINIO · sokoban.modelo y subpaquetes</text>
<line x1="1130" y1="580" x2="1540" y2="580" stroke="#C8683A" stroke-width="1"/>
<text x="1139.0" y="597.5" font-size="12" fill="#1E1A17">JuegoSokoban  ← implementa Juego (sujeto del Observer)</text>
<text x="1149.2" y="614.5" font-size="12" fill="#1E1A17">deshacer con fotos del nivel (idea de Memento)</text>
<text x="1139.0" y="631.5" font-size="12" fill="#1E1A17">CargadorNivel, EstadoNivel, Posicion</text>
<text x="1139.0" y="648.5" font-size="12" fill="#1E1A17">entidades: Jugador, Caja</text>
<text x="1139.0" y="665.5" font-size="12" fill="#1E1A17">estrategias: ComportamientoCaja + 3 cajas  ← Strategy</text>
<text x="1139.0" y="682.5" font-size="12" fill="#1E1A17">movimiento: MediadorMovimiento, MotorMovimiento  ← Mediator</text>
<text x="1139.0" y="699.5" font-size="12" fill="#1E1A17">niveles/: nivel1.txt a nivel3.txt</text>
</g>
<g class="caja" id="Arte">
<rect x="60" y="650" width="330" height="84" rx="6" fill="#D5E8D4" stroke="#82B366" stroke-width="1.4"/>
<text x="225.0" y="667" text-anchor="middle" font-size="10.5" fill="#6B6B6B">«carpeta · Martín»</text>
<text x="225.0" y="682" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1A17">ARTE · assets/</text>
<line x1="60" y1="690" x2="390" y2="690" stroke="#82B366" stroke-width="1"/>
<text x="69.0" y="707.5" font-size="12" fill="#1E1A17">104 imágenes PNG (se usan 30)</text>
<text x="69.0" y="724.5" font-size="12" fill="#1E1A17">personaje, cajas, pisos, paredes, fondos, HUD</text>
</g>
<path d="M 490 770 L 1548 770 L 1560 782 L 1560 850 L 490 850 Z" fill="#FFFDF5" stroke="#B8892A" stroke-width="1.2"/>
<text x="500" y="788" font-size="12" font-weight="700" fill="#6E1A2C">La idea de esta arquitectura</text>
<text x="500" y="806" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">Por qué importa:</tspan> la VISTA solo conoce el CONTRATO (interfaces). El dominio y el sonido también dependen solo del contrato:</text>
<text x="500" y="822" font-size="11.5" fill="#1E1A17">JuegoConSonido envuelve «un Juego» sin saber que adentro está JuegoSokoban. Por eso las dos partes entraron sin tocar la vista</text>
<text x="500" y="838" font-size="11.5" fill="#1E1A17">(solo se sumaron símbolos en PanelTablero) y cambiando unas pocas líneas de Main. Eso es el principio <tspan font-weight="700">DIP</tspan> (inversión de dependencias).</text>
<text x="60" y="790" font-size="12.5" font-weight="400" fill="#1E1A17" text-anchor="start"><tspan font-weight="700">Quién hizo cada parte</tspan></text>
<rect x="60" y="804" width="30" height="16" rx="3" fill="#DAE8FC" stroke="#6C8EBF"/>
<text x="100" y="816.5" font-size="12" font-weight="400" fill="#1E1A17" text-anchor="start">Luca · interfaz gráfica Swing y contrato</text>
<rect x="60" y="826" width="30" height="16" rx="3" fill="#D5E8D4" stroke="#82B366"/>
<text x="100" y="838.5" font-size="12" font-weight="400" fill="#1E1A17" text-anchor="start">Martín · arte (assets/)</text>
<rect x="60" y="848" width="30" height="16" rx="3" fill="#FFF2CC" stroke="#D6B656"/>
<text x="100" y="860.5" font-size="12" font-weight="400" fill="#1E1A17" text-anchor="start">Integración Luca + Martín (asistida por IA)</text>
<rect x="60" y="870" width="30" height="16" rx="3" fill="#FCDDC7" stroke="#C8683A"/>
<text x="100" y="882.5" font-size="12" font-weight="400" fill="#1E1A17" text-anchor="start">Pedro y Lucía · dominio y personaje</text>
<rect x="60" y="892" width="30" height="16" rx="3" fill="#EEDDF3" stroke="#A0559F"/>
<text x="100" y="904.5" font-size="12" font-weight="400" fill="#1E1A17" text-anchor="start">Mora · sonido</text>
</svg>