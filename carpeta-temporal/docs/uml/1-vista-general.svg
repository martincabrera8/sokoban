<g class="caja" id="Main">
<rect x="600" y="90" width="330" height="101" rx="6" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.4"/>
<text x="765.0" y="107" text-anchor="middle" font-size="10.5" fill="#6B6B6B">«paquete»</text>
<text x="765.0" y="122" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1A17">sokoban · arranque</text>
<line x1="600" y1="130" x2="930" y2="130" stroke="#6C8EBF" stroke-width="1"/>
<text x="609.0" y="147.5" font-size="12" fill="#1E1A17">Main: crea las piezas y las conecta</text>
<text x="609.0" y="164.5" font-size="12" fill="#1E1A17">new JuegoConSonido(new JuegoSokoban(</text>
<text x="622.6" y="181.5" font-size="12" fill="#1E1A17">new CargadorNivel(carpeta)))</text>
</g>
<g class="caja" id="Swing">
<rect x="60" y="90" width="230" height="67" rx="6" fill="#FFFFFF" stroke="#9E9E9E" stroke-width="1.4"/>
<text x="175.0" y="107" text-anchor="middle" font-size="10.5" fill="#6B6B6B">«biblioteca»</text>
<text x="175.0" y="122" text-anchor="middle" font-size="14" font-weight="600" fill="#6B6B6B">javax.swing (Java)</text>
<line x1="60" y1="130" x2="290" y2="130" stroke="#9E9E9E" stroke-width="1"/>
<text x="69.0" y="147.5" font-size="12" fill="#6B6B6B">JFrame, JPanel, JDialog, JButton…</text>
</g>
<g class="caja" id="Vista">
<rect x="60" y="290" width="330" height="186" rx="6" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.4"/>
<text x="225.0" y="307" text-anchor="middle" font-size="10.5" fill="#6B6B6B">«paquete · Luca»</text>
<text x="225.0" y="322" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1A17">VISTA · sokoban.vista</text>
<line x1="60" y1="330" x2="390" y2="330" stroke="#6C8EBF" stroke-width="1"/>
<text x="69.0" y="347.5" font-size="12" fill="#1E1A17">VentanaPrincipal (ventana)</text>
<text x="69.0" y="364.5" font-size="12" fill="#1E1A17">MenuPrincipal (menú) y PanelAyuda (Cómo jugar)</text>
<text x="69.0" y="381.5" font-size="12" fill="#1E1A17">PantallaJuego (partida y teclado)</text>
<text x="69.0" y="398.5" font-size="12" fill="#1E1A17">PanelHUD (indicadores y botones)</text>
<text x="69.0" y="415.5" font-size="12" fill="#1E1A17">PanelTablero (dibuja el tablero)</text>
<text x="69.0" y="432.5" font-size="12" fill="#1E1A17">Cartel (pausa, caja rota, resultado)</text>
<text x="69.0" y="449.5" font-size="12" fill="#1E1A17">Imagenes (caché de imágenes)  ← Singleton</text>
<text x="69.0" y="466.5" font-size="12" fill="#1E1A17">Epoca (estilo por época) · integración</text>
</g>
<g class="caja" id="Contrato">
<rect x="600" y="330" width="330" height="152" rx="6" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.4"/>
<text x="765.0" y="347" text-anchor="middle" font-size="10.5" fill="#6B6B6B">«paquete · Luca»</text>
<text x="765.0" y="362" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1A17">CONTRATO · sokoban.modelo</text>
<line x1="600" y1="370" x2="930" y2="370" stroke="#6C8EBF" stroke-width="1"/>
<text x="609.0" y="387.5" font-size="12" fill="#1E1A17">SujetoJuego  ← sujeto del Observer</text>
<text x="609.0" y="404.5" font-size="12" fill="#1E1A17">Juego  ← Facade (extiende SujetoJuego)</text>
<text x="609.0" y="421.5" font-size="12" fill="#1E1A17">JuegoDecorado  ← base del Decorator</text>
<text x="609.0" y="438.5" font-size="12" fill="#1E1A17">ObservadorJuego  ← Observer</text>
<text x="609.0" y="455.5" font-size="12" fill="#1E1A17">EstadoJuego  ← DTO (record) con el Evento</text>
<text x="609.0" y="472.5" font-size="12" fill="#1E1A17">Direccion  ← enum</text>
</g>
<g class="caja" id="Comandos">
<rect x="600" y="600" width="330" height="101" rx="6" fill="#D5E8D4" stroke="#82B366" stroke-width="1.4"/>
<text x="765.0" y="617" text-anchor="middle" font-size="10.5" fill="#6B6B6B">«paquete · Martín»</text>
<text x="765.0" y="632" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1A17">REPETICIÓN · sokoban.comandos</text>
<line x1="600" y1="640" x2="930" y2="640" stroke="#82B366" stroke-width="1"/>
<text x="609.0" y="657.5" font-size="12" fill="#1E1A17">Comando + 3 comandos  ← Command</text>
<text x="609.0" y="674.5" font-size="12" fill="#1E1A17">GrabadoraDePartida (invocador:</text>
<text x="609.0" y="691.5" font-size="12" fill="#1E1A17">graba y reproduce la partida)</text>
</g>
<g class="caja" id="Sonido">
<rect x="1130" y="290" width="410" height="152" rx="6" fill="#EEDDF3" stroke="#A0559F" stroke-width="1.4"/>
<text x="1335.0" y="307" text-anchor="middle" font-size="10.5" fill="#6B6B6B">«paquete · Mora»</text>
<text x="1335.0" y="322" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1A17">SONIDO · sokoban.sonido</text>
<line x1="1130" y1="330" x2="1540" y2="330" stroke="#A0559F" stroke-width="1"/>
<text x="1139.0" y="347.5" font-size="12" fill="#1E1A17">JuegoConSonido  ← Decorator (extiende JuegoDecorado)</text>
<text x="1139.0" y="364.5" font-size="12" fill="#1E1A17">Sonidos  ← Singleton + Facade de javax.sound</text>
<text x="1139.0" y="381.5" font-size="12" fill="#1E1A17">EstadoSonido, SonidoActivado, SonidoSilenciado  ← State</text>
<text x="1139.0" y="398.5" font-size="12" fill="#1E1A17">Sonido (16 efectos, Sonido.de(evento))</text>
<text x="1139.0" y="415.5" font-size="12" fill="#1E1A17">SonidosDeInterfaz (clics y tecla M)</text>
<text x="1139.0" y="432.5" font-size="12" fill="#1E1A17">assets/sonidos/: 16 archivos .wav propios</text>
</g>
<g class="caja" id="Dominio">
<rect x="1130" y="560" width="410" height="203" rx="6" fill="#FCDDC7" stroke="#C8683A" stroke-width="1.4"/>
<text x="1335.0" y="577" text-anchor="middle" font-size="10.5" fill="#6B6B6B">«paquete · Pedro y Lucía · Martín»</text>
<text x="1335.0" y="592" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1A17">DOMINIO · sokoban.modelo y subpaquetes</text>
<line x1="1130" y1="600" x2="1540" y2="600" stroke="#C8683A" stroke-width="1"/>
<text x="1139.0" y="617.5" font-size="12" fill="#1E1A17">JuegoSokoban  ← Facade + sujeto concreto del Observer</text>
<text x="1139.0" y="634.5" font-size="12" fill="#1E1A17">CargadorNivel, EstadoNivel, Posicion,</text>
<text x="1139.0" y="651.5" font-size="12" fill="#1E1A17">Puntaje, Evento (qué pasó en la última jugada)</text>
<text x="1139.0" y="668.5" font-size="12" fill="#1E1A17">entidades: ElementoMovil, Jugador, Caja  (colegas)</text>
<text x="1139.0" y="685.5" font-size="12" fill="#1E1A17">estrategias: ComportamientoCaja + 3  ← Strategy</text>
<text x="1139.0" y="702.5" font-size="12" fill="#1E1A17">movimiento: MediadorMovimiento, Motor  ← Mediator</text>
<text x="1139.0" y="719.5" font-size="12" fill="#1E1A17">Memento: EstadoNivel y RecuerdoNivel; cuidadores en</text>
<text x="1139.0" y="736.5" font-size="12" fill="#1E1A17">tiempo: HistorialDeshacer y MaquinaDelTiempo (Martín)</text>
<text x="1139.0" y="753.5" font-size="12" fill="#1E1A17">niveles/: nivel1.txt a nivel3.txt</text>
</g>
<g class="caja" id="Arte">
<rect x="60" y="650" width="330" height="84" rx="6" fill="#D5E8D4" stroke="#82B366" stroke-width="1.4"/>
<text x="225.0" y="667" text-anchor="middle" font-size="10.5" fill="#6B6B6B">«carpeta · Martín»</text>
<text x="225.0" y="682" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1A17">ARTE · assets/</text>
<line x1="60" y1="690" x2="390" y2="690" stroke="#82B366" stroke-width="1"/>
<text x="69.0" y="707.5" font-size="12" fill="#1E1A17">107 imágenes PNG (se usan 33)</text>
<text x="69.0" y="724.5" font-size="12" fill="#1E1A17">personaje, cajas, pisos, paredes, fondos, HUD</text>
</g>
<path d="M 490 820 L 1548 820 L 1560 832 L 1560 900 L 490 900 Z" fill="#FFFDF5" stroke="#B8892A" stroke-width="1.2"/>
<text x="500" y="838" font-size="12" font-weight="700" fill="#6E1A2C">La idea de esta arquitectura</text>
<text x="500" y="856" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">Por qué importa:</tspan> la VISTA solo conoce el CONTRATO (interfaces). El dominio y el sonido también dependen solo del contrato:</text>
<text x="500" y="872" font-size="11.5" fill="#1E1A17">JuegoConSonido (con su base JuegoDecorado) envuelve «un Juego» sin saber que adentro está JuegoSokoban. Por eso el dominio,</text>
<text x="500" y="888" font-size="11.5" fill="#1E1A17">el sonido y las funcionalidades nuevas entraron casi sin tocar la vista. Eso es el principio <tspan font-weight="700">DIP</tspan> (inversión de dependencias).</text>
<text x="60" y="830" font-size="12.5" font-weight="400" fill="#1E1A17" text-anchor="start"><tspan font-weight="700">Quién hizo cada parte</tspan></text>
<rect x="60" y="844" width="30" height="16" rx="3" fill="#DAE8FC" stroke="#6C8EBF"/>
<text x="100" y="856.5" font-size="12" font-weight="400" fill="#1E1A17" text-anchor="start">Luca · interfaz gráfica Swing y contrato</text>
<rect x="60" y="866" width="30" height="16" rx="3" fill="#D5E8D4" stroke="#82B366"/>
<text x="100" y="878.5" font-size="12" font-weight="400" fill="#1E1A17" text-anchor="start">Martín · arte, DeLorean y repetición</text>
<rect x="60" y="888" width="30" height="16" rx="3" fill="#FFF2CC" stroke="#D6B656"/>
<text x="100" y="900.5" font-size="12" font-weight="400" fill="#1E1A17" text-anchor="start">Integración Luca + Martín (asistida por IA)</text>
<rect x="60" y="910" width="30" height="16" rx="3" fill="#FCDDC7" stroke="#C8683A"/>
<text x="100" y="922.5" font-size="12" font-weight="400" fill="#1E1A17" text-anchor="start">Pedro y Lucía · dominio y personaje</text>
<rect x="60" y="932" width="30" height="16" rx="3" fill="#EEDDF3" stroke="#A0559F"/>
<text x="100" y="944.5" font-size="12" font-weight="400" fill="#1E1A17" text-anchor="start">Mora · sonido</text>
</svg>