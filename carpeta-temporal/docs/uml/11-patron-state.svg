<text x="1338.0" y="300" font-size="11" font-weight="400" fill="#7B3FA0" text-anchor="start">implementan</text>
<path d="M 50 620 L 678 620 L 690 632 L 690 732 L 50 732 Z" fill="#FFFDF5" stroke="#B8892A" stroke-width="1.2"/>
<text x="60" y="638" font-size="12" font-weight="700" fill="#6E1A2C">Cómo se lee (seguí los números)</text>
<text x="60" y="656" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">1</tspan> Sonidos (el contexto) guarda el estado actual en un atributo.</text>
<text x="60" y="672" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">2</tspan> Al apretar M, Sonidos.alternarSonido() le pasa el pedido al estado:</text>
<text x="60" y="688" font-size="11.5" fill="#1E1A17">     Activado corta lo que suena y pasa a Silenciado; Silenciado vuelve a Activado.</text>
<text x="60" y="704" font-size="11.5" fill="#1E1A17">     El estado hace la transición con contexto.establecerEstado(...).</text>
<text x="60" y="720" font-size="11.5" fill="#1E1A17">Sonidos no tiene ningún if «si está silenciado…»: lo decide el estado.</text>
<path d="M 740 620 L 1628 620 L 1640 632 L 1640 748 L 740 748 Z" fill="#FFFDF5" stroke="#B8892A" stroke-width="1.2"/>
<text x="750" y="638" font-size="12" font-weight="700" fill="#6E1A2C">El código clave (sonido/Sonidos.java)</text>
<text x="750" y="656" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">public void reproducir(Sonido sonido) {           // Sonidos (contexto)</text>
<text x="750" y="672" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">    Clip clip = clips.get(sonido);</text>
<text x="750" y="688" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">    if (clip != null) estado.reproducir(clip);  // el estado decide</text>
<text x="750" y="704" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">}</text>
<text x="750" y="720" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">// SonidoActivado.reproducir: stop, volver al inicio y start</text>
<text x="750" y="736" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">// SonidoSilenciado.reproducir: no hace nada</text>
</svg>