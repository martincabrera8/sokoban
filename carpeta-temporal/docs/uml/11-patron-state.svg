<text x="30" y="40" font-size="22" font-weight="700" fill="#6E1A2C">Patrón State (comportamiento): sonido activado o silenciado</text>
<text x="30" y="62" font-size="12.5" fill="#6B6B6B">El mismo pedido (reproducir) hace cosas distintas según el estado. La tecla M cambia de estado, y cada estado sabe a cuál pasa.</text>
