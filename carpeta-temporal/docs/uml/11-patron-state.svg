<text x="1298.0" y="300" font-size="11" font-weight="400" fill="#7B3FA0" text-anchor="start">implementan</text>
<path d="M 50 660 L 678 660 L 690 672 L 690 788 L 50 788 Z" fill="#FFFDF5" stroke="#B8892A" stroke-width="1.2"/>
<text x="60" y="678" font-size="12" font-weight="700" fill="#6E1A2C">Cómo se lee (seguí los números)</text>
<text x="60" y="696" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">1</tspan> Sonidos (el contexto) guarda el estado actual en un atributo.</text>
<text x="60" y="712" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">2</tspan> Al apretar M, Sonidos.alternarSonido() le pasa el pedido al estado:</text>
<text x="60" y="728" font-size="11.5" fill="#1E1A17">     Activado corta lo que suena y pasa a Silenciado; Silenciado vuelve a Activado.</text>
<text x="60" y="744" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">3</tspan> El estado hace la transición llamando a contexto.establecerEstado(...).</text>
<text x="60" y="760" font-size="11.5" fill="#1E1A17">Sonidos no tiene ningún if «si está silenciado…»: lo decide el estado.</text>
<text x="60" y="776" font-size="11.5" fill="#1E1A17">EstadoSonido y sus estados son de paquete (sin public): solo los ve sokoban.sonido.</text>
<path d="M 740 660 L 1578 660 L 1590 672 L 1590 788 L 740 788 Z" fill="#FFFDF5" stroke="#B8892A" stroke-width="1.2"/>
<text x="750" y="678" font-size="12" font-weight="700" fill="#6E1A2C">El código clave (sonido/Sonidos.java)</text>
<text x="750" y="696" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">public void reproducir(Sonido sonido) {             // Sonidos (contexto)</text>
<text x="750" y="712" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">    Clip clip = clips.get(sonido);</text>
<text x="750" y="728" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">    if (clip != null) estado.reproducir(clip);    // el estado decide</text>
<text x="750" y="744" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">}</text>
<text x="750" y="760" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">// SonidoActivado.reproducir: stop, volver al inicio y start</text>
<text x="750" y="776" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">// SonidoSilenciado.reproducir: no hace nada</text>
</svg>