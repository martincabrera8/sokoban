<rect width="1640" height="800" fill="#FFFFFF"/>
<text x="30" y="40" font-size="22" font-weight="700" fill="#6E1A2C">Patrón Strategy (comportamiento): las tres cajas</text>
<text x="30" y="62" font-size="12.5" fill="#6B6B6B">Cada caja guarda un objeto «comportamiento». Para cambiar qué hace una caja al ser empujada se cambia ese objeto, no la clase Caja.</text>
