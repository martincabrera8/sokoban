<line x1="120" y1="426" x2="475" y2="426" stroke="#C8683A" stroke-width="1"/>
<line x1="120" y1="436" x2="475" y2="436" stroke="#C8683A" stroke-width="1"/>
<text x="129.0" y="453.5" font-size="12" fill="#1E1A17">+ despuesDeEmpujar(caja: Caja, estado: EstadoNivel): void</text>
<text x="129.0" y="470.5" font-size="12" fill="#1E1A17">+ simbolo(caja: Caja): char</text>
</g>
