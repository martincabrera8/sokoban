<line x1="470" y1="166" x2="763" y2="166" stroke="#C8683A" stroke-width="1"/>
<text x="479.0" y="183.5" font-size="12" fill="#1E1A17">- estrategia: ComportamientoCaja</text>
<text x="479.0" y="200.5" font-size="12" fill="#1E1A17">- resistencia: int</text>
<line x1="470" y1="210" x2="763" y2="210" stroke="#C8683A" stroke-width="1"/>
<text x="479.0" y="227.5" font-size="12" fill="#1E1A17">+ quitarResistencia(): void</text>
<text x="479.0" y="244.5" font-size="12" fill="#1E1A17">+ getSimbolo(): char</text>
<text x="479.0" y="261.5" font-size="12" fill="#1E1A17">+ despuesDeEmpujar(estado: EstadoNivel): void</text>
</g>
<g class="caja" id="ComportamientoCaja">
<rect x="1020" y="131" width="117.890625" height="17" rx="8.5" fill="#F6EBCF" stroke="#B8892A" stroke-width="1"/><text x="1028" y="143" font-size="10.5" font-weight="600" fill="#7A5A12">Estrategia (Strategy)</text>
