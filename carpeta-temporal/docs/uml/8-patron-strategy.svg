<polygon points="1147.5,251.0 1139.5,266.0 1155.5,266.0" fill="#FFFFFF" stroke="#7B3FA0" stroke-width="1.6"/>
<g class="caja" id="EstadoNivel">
<rect x="50" y="121" width="143.9375" height="17" rx="8.5" fill="#F6EBCF" stroke="#B8892A" stroke-width="1"/><text x="58" y="133" font-size="10.5" font-weight="600" fill="#7A5A12">Cliente: elige la estrategia</text>
<rect x="50" y="140" width="216" height="80" rx="6" fill="#FCDDC7" stroke="#C8683A" stroke-width="1.4"/>
<text x="158.0" y="158" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1A17">EstadoNivel</text>
<line x1="50" y1="166" x2="266" y2="166" stroke="#C8683A" stroke-width="1"/>
<text x="59.0" y="183.5" font-size="12" fill="#1E1A17">- cajas: List&lt;Caja&gt;</text>
<line x1="50" y1="193" x2="266" y2="193" stroke="#C8683A" stroke-width="1"/>
<text x="59.0" y="210.5" font-size="12" fill="#1E1A17">+ EstadoNivel(lineas: List&lt;String&gt;)</text>
</g>
<g class="caja" id="Caja">
<rect x="470" y="121" width="110.328125" height="17" rx="8.5" fill="#F6EBCF" stroke="#B8892A" stroke-width="1"/><text x="478" y="133" font-size="10.5" font-weight="600" fill="#7A5A12">Contexto (Context)</text>
<rect x="470" y="140" width="212" height="165" rx="6" fill="#FCDDC7" stroke="#C8683A" stroke-width="1.4"/>
<text x="576.0" y="158" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1A17">Caja</text>
<line x1="470" y1="166" x2="682" y2="166" stroke="#C8683A" stroke-width="1"/>
<text x="479.0" y="183.5" font-size="12" fill="#1E1A17">- estrategia: ComportamientoCaja</text>
<text x="479.0" y="200.5" font-size="12" fill="#1E1A17">- resistencia: int</text>
<text x="479.0" y="217.5" font-size="12" fill="#1E1A17">- mediador: MediadorMovimiento</text>
<line x1="470" y1="227" x2="682" y2="227" stroke="#C8683A" stroke-width="1"/>
<text x="479.0" y="244.5" font-size="12" fill="#1E1A17">+ getResistencia(): int</text>
<text x="479.0" y="261.5" font-size="12" fill="#1E1A17">+ quitarResistencia(): void</text>
<text x="479.0" y="278.5" font-size="12" fill="#1E1A17">+ getSimbolo(): char</text>
<text x="479.0" y="295.5" font-size="12" fill="#1E1A17">+ despuesDeEmpujar(): void</text>
</g>
<g class="caja" id="ComportamientoCaja">
<rect x="1020" y="131" width="117.890625" height="17" rx="8.5" fill="#F6EBCF" stroke="#B8892A" stroke-width="1"/><text x="1028" y="143" font-size="10.5" font-weight="600" fill="#7A5A12">Estrategia (Strategy)</text>
<rect x="1020" y="150" width="255" height="101" rx="6" fill="#FCDDC7" stroke="#C8683A" stroke-width="1.4"/>
<text x="1147.5" y="167" text-anchor="middle" font-size="10.5" fill="#6B6B6B">«interface»</text>
<text x="1147.5" y="182" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1A17" font-style="italic">ComportamientoCaja</text>
<line x1="1020" y1="190" x2="1275" y2="190" stroke="#C8683A" stroke-width="1"/>
<text x="1029.0" y="207.5" font-size="12" fill="#1E1A17" font-style="italic">+ despuesDeEmpujar(caja: Caja,</text>
<text x="1049.4" y="224.5" font-size="12" fill="#1E1A17">mediador: MediadorMovimiento): void</text>
<text x="1029.0" y="241.5" font-size="12" fill="#1E1A17" font-style="italic">+ simbolo(caja: Caja): char</text>
</g>
<g class="caja" id="CajaNormalStrategy">
<rect x="120" y="381" width="112.203125" height="17" rx="8.5" fill="#F6EBCF" stroke="#B8892A" stroke-width="1"/><text x="128" y="393" font-size="10.5" font-weight="600" fill="#7A5A12">Estrategia concreta</text>
<rect x="120" y="400" width="255" height="97" rx="6" fill="#FCDDC7" stroke="#C8683A" stroke-width="1.4"/>
<text x="247.5" y="418" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1A17">CajaNormalStrategy</text>
<line x1="120" y1="426" x2="375" y2="426" stroke="#C8683A" stroke-width="1"/>
<line x1="120" y1="436" x2="375" y2="436" stroke="#C8683A" stroke-width="1"/>
<text x="129.0" y="453.5" font-size="12" fill="#1E1A17">+ despuesDeEmpujar(caja: Caja,</text>
<text x="149.4" y="470.5" font-size="12" fill="#1E1A17">mediador: MediadorMovimiento): void</text>
<text x="129.0" y="487.5" font-size="12" fill="#1E1A17">+ simbolo(caja: Caja): char</text>
</g>
<g class="caja" id="CajaFragilStrategy">
<rect x="600" y="381" width="112.203125" height="17" rx="8.5" fill="#F6EBCF" stroke="#B8892A" stroke-width="1"/><text x="608" y="393" font-size="10.5" font-weight="600" fill="#7A5A12">Estrategia concreta</text>
<rect x="600" y="400" width="255" height="97" rx="6" fill="#FCDDC7" stroke="#C8683A" stroke-width="1.4"/>
<text x="727.5" y="418" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1A17">CajaFragilStrategy</text>
<line x1="600" y1="426" x2="855" y2="426" stroke="#C8683A" stroke-width="1"/>
<line x1="600" y1="436" x2="855" y2="436" stroke="#C8683A" stroke-width="1"/>
<text x="609.0" y="453.5" font-size="12" fill="#1E1A17">+ despuesDeEmpujar(caja: Caja,</text>
<text x="629.4" y="470.5" font-size="12" fill="#1E1A17">mediador: MediadorMovimiento): void</text>
<text x="609.0" y="487.5" font-size="12" fill="#1E1A17">+ simbolo(caja: Caja): char</text>
</g>
<g class="caja" id="CajaLlaveStrategy">
<rect x="1080" y="381" width="112.203125" height="17" rx="8.5" fill="#F6EBCF" stroke="#B8892A" stroke-width="1"/><text x="1088" y="393" font-size="10.5" font-weight="600" fill="#7A5A12">Estrategia concreta</text>
<rect x="1080" y="400" width="255" height="97" rx="6" fill="#FCDDC7" stroke="#C8683A" stroke-width="1.4"/>
<text x="1207.5" y="418" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1A17">CajaLlaveStrategy</text>
<line x1="1080" y1="426" x2="1335" y2="426" stroke="#C8683A" stroke-width="1"/>
<line x1="1080" y1="436" x2="1335" y2="436" stroke="#C8683A" stroke-width="1"/>
<text x="1089.0" y="453.5" font-size="12" fill="#1E1A17">+ despuesDeEmpujar(caja: Caja,</text>
<text x="1109.4" y="470.5" font-size="12" fill="#1E1A17">mediador: MediadorMovimiento): void</text>
<text x="1089.0" y="487.5" font-size="12" fill="#1E1A17">+ simbolo(caja: Caja): char</text>
</g>
<text x="1157.5" y="300" font-size="11" font-weight="400" fill="#7B3FA0" text-anchor="start">implementan</text>
<circle cx="1129.5" cy="296" r="8.5" fill="#B8892A"/><text x="1129.5" y="299.5" font-size="10" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
<text x="120" y="521" font-size="11" fill="#4A403A" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace">// no hace nada más</text>
<text x="120" y="537" font-size="11" fill="#4A403A" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace">simbolo: &#x27;$&#x27;</text>
<text x="600" y="521" font-size="11" fill="#4A403A" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace">caja.quitarResistencia();</text>
<text x="600" y="537" font-size="11" fill="#4A403A" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace">if (caja.getResistencia() &lt;= 0)</text>
<text x="600" y="553" font-size="11" fill="#4A403A" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace">    mediador.cajaRota(caja);</text>
<text x="600" y="569" font-size="11" fill="#4A403A" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace">simbolo: &#x27;f&#x27; si queda 1, si no &#x27;F&#x27;</text>
<text x="1080" y="521" font-size="11" fill="#4A403A" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace">mediador.llaveEmpujada(caja);</text>
<text x="1080" y="537" font-size="11" fill="#4A403A" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace">// el motor abre los muros si</text>
<text x="1080" y="553" font-size="11" fill="#4A403A" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace">// la llave quedó en el cerrojo</text>
<text x="1080" y="569" font-size="11" fill="#4A403A" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace">simbolo: &#x27;L&#x27;</text>
<path d="M 50 610 L 678 610 L 690 622 L 690 738 L 50 738 Z" fill="#FFFDF5" stroke="#B8892A" stroke-width="1.2"/>
<text x="60" y="628" font-size="12" font-weight="700" fill="#6E1A2C">Cómo se lee (seguí los números)</text>
<text x="60" y="646" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">1</tspan> Cada Caja guarda su estrategia en un atributo (la recibe al crearse).</text>
<text x="60" y="662" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">2</tspan> Las tres estrategias cumplen el mismo contrato ComportamientoCaja.</text>
<text x="60" y="678" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">3</tspan> Después de un empuje, la Caja no pregunta «¿qué tipo soy?»:</text>
<text x="60" y="694" font-size="11.5" fill="#1E1A17">     le pasa el pedido a su estrategia (código de la derecha).</text>
<text x="60" y="710" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">Quién elige:</tspan> el constructor de EstadoNivel, según la letra del .txt:</text>
<text x="60" y="726" font-size="11.5" fill="#1E1A17">     $ normal · F frágil (resistencia 3) · L llave.</text>
<path d="M 740 610 L 1578 610 L 1590 622 L 1590 738 L 740 738 Z" fill="#FFFDF5" stroke="#B8892A" stroke-width="1.2"/>
<text x="750" y="628" font-size="12" font-weight="700" fill="#6E1A2C">El código clave (entidades/Caja.java)</text>
<text x="750" y="646" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">public void despuesDeEmpujar() {                 // 3. la Caja delega</text>
<text x="750" y="662" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">    estrategia.despuesDeEmpujar(this, mediador);  // y le pasa el mediador</text>
<text x="750" y="678" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">}</text>
<text x="750" y="694" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">public char getSimbolo() { return estrategia.simbolo(this); }</text>
<text x="750" y="710" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">// Una caja nueva (por ejemplo, explosiva) = una clase nueva que implemente</text>
<text x="750" y="726" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">// ComportamientoCaja y una letra más en EstadoNivel. Caja no cambia (OCP).</text>
</svg>