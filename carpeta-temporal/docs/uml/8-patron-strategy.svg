</g>
<g class="caja" id="Caja">
<rect x="470" y="121" width="110.328125" height="17" rx="8.5" fill="#F6EBCF" stroke="#B8892A" stroke-width="1"/><text x="478" y="133" font-size="10.5" font-weight="600" fill="#7A5A12">Contexto (Context)</text>
<rect x="470" y="140" width="293" height="131" rx="6" fill="#FCDDC7" stroke="#C8683A" stroke-width="1.4"/>
