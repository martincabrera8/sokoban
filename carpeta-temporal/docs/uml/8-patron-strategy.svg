<g class="caja" id="EstadoNivel">
<rect x="50" y="121" width="143.9375" height="17" rx="8.5" fill="#F6EBCF" stroke="#B8892A" stroke-width="1"/><text x="58" y="133" font-size="10.5" font-weight="600" fill="#7A5A12">Cliente: elige la estrategia</text>
<rect x="50" y="140" width="216" height="80" rx="6" fill="#FCDDC7" stroke="#C8683A" stroke-width="1.4"/>
<text x="158.0" y="158" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1A17">EstadoNivel</text>
<line x1="50" y1="166" x2="266" y2="166" stroke="#C8683A" stroke-width="1"/>
<text x="59.0" y="183.5" font-size="12" fill="#1E1A17">- cajas: List&lt;Caja&gt;</text>
