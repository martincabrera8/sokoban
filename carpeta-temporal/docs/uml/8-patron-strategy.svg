<text x="1197.5" y="167" text-anchor="middle" font-size="10.5" fill="#6B6B6B">«interface»</text>
<text x="1197.5" y="182" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1A17" font-style="italic">ComportamientoCaja</text>
<line x1="1020" y1="190" x2="1375" y2="190" stroke="#C8683A" stroke-width="1"/>
<text x="1029.0" y="207.5" font-size="12" fill="#1E1A17" font-style="italic">+ despuesDeEmpujar(caja: Caja, estado: EstadoNivel): void</text>
<text x="1029.0" y="224.5" font-size="12" fill="#1E1A17" font-style="italic">+ simbolo(caja: Caja): char</text>
</g>
