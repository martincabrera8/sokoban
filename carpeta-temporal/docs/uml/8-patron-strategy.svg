<text x="1237.5" y="400" font-size="11" font-weight="400" fill="#7B3FA0" text-anchor="start">implementan</text>
<circle cx="1209.5" cy="396" r="8.5" fill="#B8892A"/><text x="1209.5" y="399.5" font-size="10" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
<path d="M 50 677 L 738 677 L 750 689 L 750 805 L 50 805 Z" fill="#FFFDF5" stroke="#B8892A" stroke-width="1.2"/>
<text x="60" y="695" font-size="12" font-weight="700" fill="#6E1A2C">Cómo se lee (seguí los números)</text>
<text x="60" y="713" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">1</tspan> Cada Caja guarda su comportamiento en un atributo (lo recibe al crearse).</text>
<text x="60" y="729" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">2</tspan> Las tres estrategias cumplen el mismo contrato ComportamientoCaja.</text>
<text x="60" y="745" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">3</tspan> Cuando el MotorMovimiento empuja una caja llama a caja.despuesDeEmpujar():</text>
<text x="60" y="761" font-size="11.5" fill="#1E1A17">     la Caja no pregunta «¿qué tipo soy?», le pasa el pedido a su estrategia.</text>
<text x="60" y="777" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">Quién elige:</tspan> el constructor de EstadoNivel hace new según la letra del .txt:</text>
<text x="60" y="793" font-size="11.5" fill="#1E1A17">     $ normal · F frágil (resistencia 3) · L llave.</text>
<path d="M 790 677 L 1578 677 L 1590 689 L 1590 821 L 790 821 Z" fill="#FFFDF5" stroke="#B8892A" stroke-width="1.2"/>
<text x="800" y="695" font-size="12" font-weight="700" fill="#6E1A2C">El código clave (entidades/Caja.java)</text>
<text x="800" y="713" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">public void despuesDeEmpujar() {                       // Caja</text>
<text x="800" y="729" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">    comportamiento.despuesDeEmpujar(this, mediador);</text>
<text x="800" y="745" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">}</text>
<text x="800" y="761" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">public char getSimbolo() { return comportamiento.simbolo(this); }</text>
<text x="800" y="777" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">// Normal: no hace nada (&#x27;$&#x27;).  Llave: mediador.llaveEmpujada(caja) (&#x27;L&#x27;).</text>
<text x="800" y="793" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">// Frágil: quitarResistencia(); si le queda, mediador.cajaDanada(caja);</text>
<text x="800" y="809" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">//         si no, mediador.cajaRota(caja) (&#x27;F&#x27;, o &#x27;f&#x27; si le queda 1).</text>
</svg>