<rect x="600" y="400" width="355" height="80" rx="6" fill="#FCDDC7" stroke="#C8683A" stroke-width="1.4"/>
<text x="777.5" y="418" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1A17">CajaFragilStrategy</text>
<line x1="600" y1="426" x2="955" y2="426" stroke="#C8683A" stroke-width="1"/>
<line x1="600" y1="436" x2="955" y2="436" stroke="#C8683A" stroke-width="1"/>
