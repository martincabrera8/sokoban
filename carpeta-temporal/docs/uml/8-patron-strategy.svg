<g class="caja" id="CajaLlaveStrategy">
<rect x="1080" y="381" width="112.203125" height="17" rx="8.5" fill="#F6EBCF" stroke="#B8892A" stroke-width="1"/><text x="1088" y="393" font-size="10.5" font-weight="600" fill="#7A5A12">Estrategia concreta</text>
<rect x="1080" y="400" width="355" height="80" rx="6" fill="#FCDDC7" stroke="#C8683A" stroke-width="1.4"/>
<text x="1257.5" y="418" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1A17">CajaLlaveStrategy</text>
<line x1="1080" y1="426" x2="1435" y2="426" stroke="#C8683A" stroke-width="1"/>
<line x1="1080" y1="436" x2="1435" y2="436" stroke="#C8683A" stroke-width="1"/>
<text x="1089.0" y="453.5" font-size="12" fill="#1E1A17">+ despuesDeEmpujar(caja: Caja, estado: EstadoNivel): void</text>
<text x="1089.0" y="470.5" font-size="12" fill="#1E1A17">+ simbolo(caja: Caja): char</text>
</g>
<text x="1207.5" y="300" font-size="11" font-weight="400" fill="#7B3FA0" text-anchor="start">implementan</text>
<circle cx="1179.5" cy="296" r="8.5" fill="#B8892A"/><text x="1179.5" y="299.5" font-size="10" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
<text x="120" y="504" font-size="11" fill="#4A403A" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace">// no hace nada más</text>
<text x="120" y="520" font-size="11" fill="#4A403A" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace">simbolo: &#x27;$&#x27;</text>
<text x="600" y="504" font-size="11" fill="#4A403A" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace">caja.quitarResistencia();</text>
<text x="600" y="520" font-size="11" fill="#4A403A" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace">if (caja.getResistencia() &lt;= 0)</text>
<text x="600" y="536" font-size="11" fill="#4A403A" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace">    estado.quitarCaja(caja);</text>
<text x="600" y="552" font-size="11" fill="#4A403A" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace">simbolo: &#x27;f&#x27; si queda 1, si no &#x27;F&#x27;</text>
<text x="1080" y="504" font-size="11" fill="#4A403A" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace">if (estado.esCerrojo(caja.getPosicion()))</text>
<text x="1080" y="520" font-size="11" fill="#4A403A" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace">    estado.abrirMuros();</text>
<text x="1080" y="536" font-size="11" fill="#4A403A" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace">simbolo: &#x27;L&#x27;</text>
<path d="M 50 610 L 678 610 L 690 622 L 690 738 L 50 738 Z" fill="#FFFDF5" stroke="#B8892A" stroke-width="1.2"/>
<text x="60" y="628" font-size="12" font-weight="700" fill="#6E1A2C">Cómo se lee (seguí los números)</text>
<text x="60" y="646" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">1</tspan> Cada Caja guarda su estrategia en un atributo (la recibe al crearse).</text>
<text x="60" y="662" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">2</tspan> Las tres estrategias cumplen el mismo contrato ComportamientoCaja.</text>
<text x="60" y="678" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">3</tspan> Después de un empuje, la Caja no pregunta «¿qué tipo soy?»:</text>
<text x="60" y="694" font-size="11.5" fill="#1E1A17">     le pasa el pedido a su estrategia (código de la derecha).</text>
<text x="60" y="710" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">Quién elige:</tspan> el constructor de EstadoNivel, según la letra del .txt:</text>
<text x="60" y="726" font-size="11.5" fill="#1E1A17">     $ normal · F frágil (resistencia 3) · L llave.</text>
<path d="M 740 610 L 1578 610 L 1590 622 L 1590 738 L 740 738 Z" fill="#FFFDF5" stroke="#B8892A" stroke-width="1.2"/>
<text x="750" y="628" font-size="12" font-weight="700" fill="#6E1A2C">El código clave (entidades/Caja.java)</text>
<text x="750" y="646" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">public void despuesDeEmpujar(EstadoNivel estado) {    // 3. la Caja delega</text>
<text x="750" y="662" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">    estrategia.despuesDeEmpujar(this, estado);</text>
<text x="750" y="678" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">}</text>
<text x="750" y="694" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">public char getSimbolo() { return estrategia.simbolo(this); }</text>
<text x="750" y="710" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">// Una caja nueva (por ejemplo, explosiva) = una clase nueva que implemente</text>
<text x="750" y="726" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">// ComportamientoCaja y una letra más en EstadoNivel. Caja no cambia (OCP).</text>
</svg>