<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 600" width="1520" height="600" font-family="Inter, Arial, sans-serif">
<style>text{white-space:pre}</style>
<rect width="1520" height="600" fill="#FFFFFF"/>
<text x="30" y="40" font-size="22" font-weight="700" fill="#6E1A2C">MVC: quién hace qué</text>
<text x="30" y="62" font-size="12.5" fill="#6B6B6B">Modelo = reglas del juego · Vista = lo que se ve · Controlador = traduce lo que hace el usuario en pedidos al modelo.</text>
<path d="M 400.0 179.0 L 580.0 179.0" fill="none" stroke="#5F5650" stroke-width="1.6" stroke-dasharray="7 5"/>
<polyline points="569.0,173.0 580.0,179.0 569.0,185.0" fill="none" stroke="#5F5650" stroke-width="1.6"/>
<rect x="451.6796875" y="170.0" width="76.640625" height="17" rx="4" fill="#FFFFFF" fill-opacity="0.95"/><text x="490.0" y="182.5" font-size="10.5" text-anchor="middle" fill="#3A332E">tecla o botón</text><circle cx="442.6796875" cy="179.0" r="8.5" fill="#B8892A"/><text x="442.6796875" y="182.5" font-size="10" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
<path d="M 940.0 179.0 L 1120.0 179.0" fill="none" stroke="#5F5650" stroke-width="1.6" stroke-dasharray="7 5"/>
<polyline points="1109.0,173.0 1120.0,179.0 1109.0,185.0" fill="none" stroke="#5F5650" stroke-width="1.6"/>
<rect x="956.59375" y="170.0" width="146.8125" height="17" rx="4" fill="#FFFFFF" fill-opacity="0.95"/><text x="1030.0" y="182.5" font-size="10.5" text-anchor="middle" fill="#3A332E">mover · deshacer · reiniciar</text><circle cx="947.59375" cy="179.0" r="8.5" fill="#B8892A"/><text x="947.59375" y="182.5" font-size="10" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
<path d="M 1300.0 238.0 L 1300.0 360.0 L 220.0 360.0 L 220.0 238.0" fill="none" stroke="#5F5650" stroke-width="1.6" stroke-dasharray="7 5"/>
<polyline points="214.0,249.0 220.0,238.0 226.0,249.0" fill="none" stroke="#5F5650" stroke-width="1.6"/>
<rect x="611.0859375" y="351" width="237.828125" height="17" rx="4" fill="#FFFFFF" fill-opacity="0.95"/><text x="730" y="363.5" font-size="10.5" text-anchor="middle" fill="#3A332E">avisa con EstadoJuego (Observer: actualizar)</text><circle cx="602.0859375" cy="360" r="8.5" fill="#B8892A"/><text x="602.0859375" y="363.5" font-size="10" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text>
<g class="caja" id="V">
<rect x="40" y="120" width="360" height="118" rx="6" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.4"/>
<text x="220.0" y="137" text-anchor="middle" font-size="10.5" fill="#6B6B6B">«lo que se ve»</text>
<text x="220.0" y="152" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1A17">VISTA</text>
<line x1="40" y1="160" x2="400" y2="160" stroke="#6C8EBF" stroke-width="1"/>
<text x="49.0" y="177.5" font-size="12" fill="#1E1A17">VentanaPrincipal, MenuPrincipal, Cartel</text>
<text x="49.0" y="194.5" font-size="12" fill="#1E1A17">PanelHUD: muestra nivel, movimientos, empujes</text>
<text x="49.0" y="211.5" font-size="12" fill="#1E1A17">PanelTablero: dibuja el tablero</text>
<text x="49.0" y="228.5" font-size="12" fill="#1E1A17">Imagenes, Epoca: imágenes y estilo</text>
</g>
<g class="caja" id="C">
<rect x="580" y="120" width="360" height="118" rx="6" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.4"/>
<text x="760.0" y="137" text-anchor="middle" font-size="10.5" fill="#6B6B6B">«traduce acciones»</text>
<text x="760.0" y="152" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1A17">CONTROLADOR</text>
<line x1="580" y1="160" x2="940" y2="160" stroke="#6C8EBF" stroke-width="1"/>
<text x="589.0" y="177.5" font-size="12" fill="#1E1A17">PantallaJuego: flecha → juego.mover(dir)</text>
<text x="589.0" y="194.5" font-size="12" fill="#1E1A17">PanelHUD: botón → juego.deshacer() / reiniciar()</text>
<text x="589.0" y="211.5" font-size="12" fill="#1E1A17">(controlador de entrada de Swing, vive en la vista)</text>
<text x="589.0" y="228.5" font-size="12" fill="#1E1A17">ControladorJuego del dominio (pendiente)</text>
</g>
<g class="caja" id="M">
<rect x="1120" y="120" width="360" height="118" rx="6" fill="#F5F5F5" stroke="#9E9E9E" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="1300.0" y="137" text-anchor="middle" font-size="10.5" fill="#6B6B6B">«reglas del juego»</text>
<text x="1300.0" y="152" text-anchor="middle" font-size="14" font-weight="600" fill="#6B6B6B">MODELO</text>
<line x1="1120" y1="160" x2="1480" y2="160" stroke="#9E9E9E" stroke-width="1"/>
<text x="1129.0" y="177.5" font-size="12" fill="#6B6B6B">Dominio (pendiente): tablero, jugador, cajas,</text>
<text x="1129.0" y="194.5" font-size="12" fill="#6B6B6B">niveles, deshacer, puntaje</text>
<text x="1129.0" y="211.5" font-size="12" fill="#6B6B6B">Hoy lo simula JuegoDePrueba</text>
<text x="1129.0" y="228.5" font-size="12" fill="#6B6B6B">Se accede SOLO por la interfaz Juego</text>
</g>
<path d="M 40 410 L 1468 410 L 1480 422 L 1480 506 L 40 506 Z" fill="#FFFDF5" stroke="#B8892A" stroke-width="1.2"/>
<text x="50" y="428" font-size="12" font-weight="700" fill="#6E1A2C">Para validar</text>
<text x="50" y="446" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">Regla de oro:</tspan> el modelo no conoce a la vista. Le avisa a una interfaz (ObservadorJuego) y le manda un <tspan font-weight="700">DTO inmutable</tspan></text>
<text x="50" y="462" font-size="11.5" fill="#1E1A17">(EstadoJuego), nunca un Tablero ni una Caja. Así la vista no puede romper las reglas del juego por accidente.</text>
<text x="50" y="478" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">Ojo:</tspan> en Swing es normal que la parte de «controlador de entrada» (teclas y botones) quede dentro de los paneles.</text>
<text x="50" y="494" font-size="11.5" fill="#1E1A17">El controlador GRASP (quien recibe los pedidos y coordina el dominio) va a ser la clase del dominio que implemente Juego.</text>
</svg>