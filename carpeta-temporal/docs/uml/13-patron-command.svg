<text x="1218.0" y="380" font-size="11" font-weight="400" fill="#7B3FA0" text-anchor="start">implementan</text>
<path d="M 50 851 L 798 851 L 810 863 L 810 995 L 50 995 Z" fill="#FFFDF5" stroke="#B8892A" stroke-width="1.2"/>
<text x="60" y="869" font-size="12" font-weight="700" fill="#6E1A2C">Cómo se lee (seguí los números)</text>
<text x="60" y="887" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">1</tspan> PantallaJuego (cliente) traduce cada tecla o botón en un comando:</text>
<text x="60" y="903" font-size="11.5" fill="#1E1A17">     new ComandoMover(juego, direccion), new ComandoDeshacer(juego)...</text>
<text x="60" y="919" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">2</tspan> La GrabadoraDePartida (invocador) lo ejecuta y lo anota en comandos.</text>
<text x="60" y="935" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">3</tspan> Cada comando sabe a quién pedirle el trabajo: al Juego (receptor).</text>
<text x="60" y="951" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">Ver repetición:</tspan> el nivel vuelve a empezar y la grabadora reproduce los comandos</text>
<text x="60" y="967" font-size="11.5" fill="#1E1A17">     grabados, uno cada 160 ms (Esc: saltarAlFinal). Termina en el mismo estado.</text>
<text x="60" y="983" font-size="11.5" fill="#1E1A17">Reiniciar no se graba: borra la grabación.</text>
<path d="M 860 851 L 1588 851 L 1600 863 L 1600 1011 L 860 1011 Z" fill="#FFFDF5" stroke="#B8892A" stroke-width="1.2"/>
<text x="870" y="869" font-size="12" font-weight="700" fill="#6E1A2C">El código clave (Martín)</text>
<text x="870" y="887" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">private void mover(Direccion direccion) {          // PantallaJuego</text>
<text x="870" y="903" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">    tablero.mirarHacia(direccion);</text>
<text x="870" y="919" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">    grabadora.ejecutar(new ComandoMover(juego, direccion));</text>
<text x="870" y="935" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">    ...  // avisa si se guardó un punto en el tiempo</text>
<text x="870" y="951" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">}</text>
<text x="870" y="967" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">public void ejecutar(Comando comando) {            // GrabadoraDePartida</text>
<text x="870" y="983" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">    if (estaReproduciendo()) return;</text>
<text x="870" y="999" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">    comando.ejecutar(); comandos.add(comando); }</text>
</svg>