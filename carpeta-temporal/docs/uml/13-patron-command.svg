<text x="1168.0" y="554" font-size="11" font-weight="400" fill="#7B3FA0" text-anchor="start">implementan</text>
<path d="M 50 800 L 798 800 L 810 812 L 810 944 L 50 944 Z" fill="#FFFDF5" stroke="#B8892A" stroke-width="1.2"/>
<text x="60" y="818" font-size="12" font-weight="700" fill="#6E1A2C">Cómo se lee (seguí los números)</text>
<text x="60" y="836" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">1</tspan> PantallaJuego (cliente) traduce cada tecla o botón en un comando:</text>
<text x="60" y="852" font-size="11.5" fill="#1E1A17">     new ComandoMover(juego, direccion), new ComandoDeshacer(juego)...</text>
<text x="60" y="868" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">2</tspan> La GrabadoraDePartida (invocador) lo ejecuta y lo anota en grabados.</text>
<text x="60" y="884" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">3</tspan> Cada comando sabe a quién pedirle el trabajo: al Juego (receptor).</text>
<text x="60" y="900" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">4</tspan> «Ver repetición» reinicia el nivel y Repeticion vuelve a ejecutar los comandos</text>
<text x="60" y="916" font-size="11.5" fill="#1E1A17">     grabados, uno cada 160 ms. Termina exactamente en el mismo estado.</text>
<text x="60" y="932" font-size="11.5" fill="#1E1A17">Reiniciar no se graba: borra la grabación.</text>
<path d="M 860 800 L 1588 800 L 1600 812 L 1600 928 L 860 928 Z" fill="#FFFDF5" stroke="#B8892A" stroke-width="1.2"/>
<text x="870" y="818" font-size="12" font-weight="700" fill="#6E1A2C">El código clave (Martín)</text>
<text x="870" y="836" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">private void mover(Direccion direccion) {          // PantallaJuego</text>
<text x="870" y="852" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">    tablero.mirarHacia(direccion);</text>
<text x="870" y="868" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">    grabadora.ejecutar(new ComandoMover(juego, direccion));</text>
<text x="870" y="884" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">    ...  // si se guardó un punto en el tiempo, avisa abajo</text>
<text x="870" y="900" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">}</text>
<text x="870" y="916" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">public void ejecutar(Comando c) { c.ejecutar(); grabados.add(c); }  // Grabadora</text>
</svg>