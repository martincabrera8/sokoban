<text x="30" y="40" font-size="22" font-weight="700" fill="#6E1A2C">Patrón Command (comportamiento): la repetición de la partida</text>
<text x="30" y="62" font-size="12.5" fill="#6B6B6B">Cada acción del jugador es un objeto. La grabadora los ejecuta y los anota; al terminar el nivel se pueden volver a ejecutar uno por uno.</text>
