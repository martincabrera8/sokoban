<text x="670" y="114" font-size="13" font-weight="700" fill="#6E1A2C" text-anchor="start">ES UN  ·  herencia (extends)</text>
<text x="670" y="134" font-size="12.5" font-weight="400" fill="#1E1A17" text-anchor="start">PanelHUD es un panel de Swing: hereda todo lo de JPanel.</text>
<text x="670" y="156" font-size="11.5" fill="#4A403A" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace">public class PanelHUD extends JPanel</text>
<text x="670" y="222" font-size="13" font-weight="700" fill="#6E1A2C" text-anchor="start">CUMPLE UN CONTRATO  ·  realización (implements)</text>
<text x="670" y="242" font-size="12.5" font-weight="400" fill="#1E1A17" text-anchor="start">Promete tener el método actualizar(estado).</text>
<text x="670" y="264" font-size="11.5" fill="#4A403A" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace">public class PanelHUD extends JPanel implements ObservadorJuego</text>
<text x="670" y="330" font-size="13" font-weight="700" fill="#6E1A2C" text-anchor="start">LO CREA Y LO CONTIENE  ·  composición (◆ lleno)</text>
<text x="670" y="350" font-size="12.5" font-weight="400" fill="#1E1A17" text-anchor="start">PantallaJuego crea su HUD; el HUD no existe sin la pantalla.</text>
<text x="670" y="372" font-size="11.5" fill="#4A403A" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace">PanelHUD hud = new PanelHUD(juego, this::pausar);  add(hud);</text>
<text x="670" y="438" font-size="13" font-weight="700" fill="#6E1A2C" text-anchor="start">TIENE UNA LISTA, SIN CREARLOS  ·  agregación (◇ vacío)</text>
<text x="670" y="458" font-size="12.5" font-weight="400" fill="#1E1A17" text-anchor="start">Se los pasan desde afuera con agregarObservador(...).</text>
<text x="670" y="480" font-size="11.5" fill="#4A403A" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace">private final List&lt;ObservadorJuego&gt; observadores = new ArrayList&lt;&gt;();</text>
<text x="670" y="546" font-size="13" font-weight="700" fill="#6E1A2C" text-anchor="start">LO GUARDA EN UN ATRIBUTO  ·  asociación</text>
<text x="670" y="566" font-size="12.5" font-weight="400" fill="#1E1A17" text-anchor="start">Lo recibe en el constructor y lo usa toda la partida.</text>
<text x="670" y="588" font-size="11.5" fill="#4A403A" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace">private final Juego juego;</text>
<text x="670" y="654" font-size="13" font-weight="700" fill="#6E1A2C" text-anchor="start">LO USA O LO CREA Y LO SUELTA  ·  dependencia (punteada)</text>
<text x="670" y="674" font-size="12.5" font-weight="400" fill="#1E1A17" text-anchor="start">Lo crea dentro de un método y no lo guarda.</text>
<text x="670" y="696" font-size="11.5" fill="#4A403A" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace">dialogo.add(new Cartel(titulo, mensaje, alElegir));</text>
<path d="M 40 760 L 1448 760 L 1460 772 L 1460 840 L 40 840 Z" fill="#FFFDF5" stroke="#B8892A" stroke-width="1.2"/>
<text x="50" y="778" font-size="12" font-weight="700" fill="#6E1A2C">Además</text>
<text x="50" y="796" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">Multiplicidad</tspan> (número en la punta): 1 = exactamente uno · 0..1 = cero o uno · 0..* = cualquier cantidad.</text>
<text x="50" y="812" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">Visibilidad</tspan>: + público · - privado · # protegido.  <tspan font-weight="700">Subrayado</tspan> = static (es de la clase, no de cada objeto).  <tspan font-weight="700">Cursiva</tspan> = abstracto (método de interfaz, sin código).</text>
<text x="50" y="828" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">«interface», «enumeration», «record»</tspan>: el tipo de la clase. Violeta = jerarquía · negro = tener · gris punteado = usar.</text>
</svg>