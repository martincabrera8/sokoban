<text x="59.0" y="343.5" font-size="12" fill="#1E1A17">- mover(direccion: Direccion): void</text>
</g>
<g class="caja" id="Juego">
<rect x="480" y="211" width="148.34375" height="17" rx="8.5" fill="#F6EBCF" stroke="#B8892A" stroke-width="1"/><text x="488" y="223" font-size="10.5" font-weight="600" fill="#7A5A12">Componente (Component)</text>
<rect x="480" y="230" width="355" height="169" rx="6" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.4"/>
