<text x="655.6" y="392" font-size="11" font-weight="400" fill="#7B3FA0" text-anchor="start">implementan</text>
<text x="1031" y="354" font-size="10.5" font-weight="400" fill="#8A7F76" text-anchor="start" font-style="italic">(un Juego cualquiera: hoy, JuegoSokoban)</text>
<path d="M 50 837 L 658 837 L 670 849 L 670 965 L 50 965 Z" fill="#FFFDF5" stroke="#B8892A" stroke-width="1.2"/>
<text x="60" y="855" font-size="12" font-weight="700" fill="#6E1A2C">Cómo se lee (seguí los números)</text>
<text x="60" y="873" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">1</tspan> El dominio y el decorador base cumplen el mismo contrato Juego.</text>
<text x="60" y="889" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">2</tspan> JuegoDecorado guarda adentro otro Juego y le pasa cada pedido.</text>
<text x="60" y="905" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">3</tspan> JuegoConSonido extiende JuegoDecorado y solo redefine lo que suena:</text>
<text x="60" y="921" font-size="11.5" fill="#1E1A17">     después de cada pedido lee el Evento del estado y elige el efecto.</text>
<text x="60" y="937" font-size="11.5" fill="#1E1A17">La vista y el dominio no se enteran: Main hace</text>
<text x="60" y="953" font-size="11.5" fill="#1E1A17">     new JuegoConSonido(new JuegoSokoban(new CargadorNivel(carpeta)))</text>
<path d="M 720 837 L 1448 837 L 1460 849 L 1460 997 L 720 997 Z" fill="#FFFDF5" stroke="#B8892A" stroke-width="1.2"/>
<text x="730" y="855" font-size="12" font-weight="700" fill="#6E1A2C">El código clave (sonido/JuegoConSonido.java)</text>
<text x="730" y="873" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">public void mover(Direccion direccion) {      // JuegoConSonido</text>
<text x="730" y="889" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">    super.mover(direccion);    // JuegoDecorado: juego.mover(direccion)</text>
<text x="730" y="905" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">    sonarLoQuePaso();</text>
<text x="730" y="921" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">}</text>
<text x="730" y="937" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">private void sonarLoQuePaso() {</text>
<text x="730" y="953" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">    EstadoJuego estado = juego.getEstado();</text>
<text x="730" y="969" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">    Sonido sonido = Sonido.de(estado.evento());   // y si rompió la última: DERROTA</text>
<text x="730" y="985" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">    if (sonido != null) Sonidos.obtenerInstancia().reproducir(sonido); ... }</text>
</svg>