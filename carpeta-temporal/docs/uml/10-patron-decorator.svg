<line x1="480" y1="270" x2="835" y2="270" stroke="#6C8EBF" stroke-width="1"/>
<text x="489.0" y="287.5" font-size="12" fill="#1E1A17" font-style="italic">+ getCantidadNiveles(): int</text>
<text x="489.0" y="304.5" font-size="12" fill="#1E1A17" font-style="italic">+ iniciarNivel(numero: int): void</text>
<text x="489.0" y="321.5" font-size="12" fill="#1E1A17" font-style="italic">+ mover(direccion: Direccion): void</text>
<text x="489.0" y="338.5" font-size="12" fill="#1E1A17" font-style="italic">+ deshacer(): void</text>
<text x="489.0" y="355.5" font-size="12" fill="#1E1A17" font-style="italic">+ reiniciar(): void</text>
<text x="489.0" y="372.5" font-size="12" fill="#1E1A17" font-style="italic">+ getEstado(): EstadoJuego</text>
<text x="489.0" y="389.5" font-size="12" fill="#1E1A17" font-style="italic">+ agregarObservador(observador: ObservadorJuego): void</text>
</g>
<g class="caja" id="JuegoSokoban">
<rect x="1060" y="91" width="188.359375" height="17" rx="8.5" fill="#F6EBCF" stroke="#B8892A" stroke-width="1"/><text x="1068" y="103" font-size="10.5" font-weight="600" fill="#7A5A12">Componente concreto (el dominio)</text>
<rect x="1060" y="110" width="219" height="114" rx="6" fill="#FCDDC7" stroke="#C8683A" stroke-width="1.4"/>
<text x="1169.5" y="128" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1A17">JuegoSokoban</text>
<line x1="1060" y1="136" x2="1279" y2="136" stroke="#C8683A" stroke-width="1"/>
<line x1="1060" y1="146" x2="1279" y2="146" stroke="#C8683A" stroke-width="1"/>
<text x="1069.0" y="163.5" font-size="12" fill="#1E1A17">+ mover(direccion: Direccion): void</text>
