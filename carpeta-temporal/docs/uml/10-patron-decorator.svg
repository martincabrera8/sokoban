<text x="1069.0" y="197.5" font-size="12" fill="#1E1A17">+ getEstado(): EstadoJuego</text>
<text x="1069.0" y="214.5" font-size="12" fill="#1E1A17">+ …  (los 7 de Juego)</text>
</g>
<g class="caja" id="JuegoConSonido">
<rect x="1060" y="321" width="128.546875" height="17" rx="8.5" fill="#F6EBCF" stroke="#B8892A" stroke-width="1"/><text x="1068" y="333" font-size="10.5" font-weight="600" fill="#7A5A12">Decorador (Decorator)</text>
<rect x="1060" y="340" width="360" height="216" rx="6" fill="#EEDDF3" stroke="#A0559F" stroke-width="1.4"/>
<text x="1240.0" y="358" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1A17">JuegoConSonido</text>
<line x1="1060" y1="366" x2="1420" y2="366" stroke="#A0559F" stroke-width="1"/>
<text x="1069.0" y="383.5" font-size="12" fill="#1E1A17">- juego: Juego</text>
<line x1="1060" y1="393" x2="1420" y2="393" stroke="#A0559F" stroke-width="1"/>
<text x="1069.0" y="410.5" font-size="12" fill="#1E1A17">+ JuegoConSonido(juego: Juego)</text>
<text x="1069.0" y="427.5" font-size="12" fill="#1E1A17">+ mover(direccion: Direccion): void</text>
<text x="1069.0" y="444.5" font-size="12" fill="#1E1A17">+ deshacer(): void</text>
<text x="1069.0" y="461.5" font-size="12" fill="#1E1A17">+ reiniciar(): void</text>
<text x="1069.0" y="478.5" font-size="12" fill="#1E1A17">+ iniciarNivel(numero: int): void</text>
<text x="1069.0" y="495.5" font-size="12" fill="#1E1A17">+ getEstado(): EstadoJuego  (solo delega)</text>
<text x="1069.0" y="512.5" font-size="12" fill="#1E1A17" text-decoration="underline">~ queSonidoCorresponde(antes: EstadoJuego,</text>
<text x="1089.4" y="529.5" font-size="12" fill="#1E1A17" text-decoration="underline">despues: EstadoJuego): Sonido</text>
<text x="1069.0" y="546.5" font-size="12" fill="#1E1A17" text-decoration="underline">- sonar(sonido: Sonido): void</text>
</g>
<text x="860" y="538.8" font-size="10.5" font-weight="400" fill="#8A7F76" text-anchor="middle" font-style="italic">(un Juego cualquiera: hoy, JuegoSokoban)</text>
<path d="M 50 610 L 658 610 L 670 622 L 670 738 L 50 738 Z" fill="#FFFDF5" stroke="#B8892A" stroke-width="1.2"/>
<text x="60" y="628" font-size="12" font-weight="700" fill="#6E1A2C">Cómo se lee (seguí los números)</text>
<text x="60" y="646" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">1</tspan> El dominio y el decorador cumplen el mismo contrato Juego.</text>
<text x="60" y="662" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">2</tspan> El decorador guarda adentro otro Juego y le pasa cada pedido.</text>
<text x="60" y="678" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">3</tspan> Antes y después de mover compara el EstadoJuego y elige el efecto</text>
<text x="60" y="694" font-size="11.5" fill="#1E1A17">     (paso, empuje, caja en destino, frágil, cerrojo, victoria, choque…).</text>
<text x="60" y="710" font-size="11.5" fill="#1E1A17">La vista y el dominio no se enteran: solo cambió Main:</text>
<text x="60" y="726" font-size="11.5" fill="#1E1A17">     new JuegoConSonido(new JuegoSokoban())</text>
<path d="M 720 610 L 1498 610 L 1510 622 L 1510 770 L 720 770 Z" fill="#FFFDF5" stroke="#B8892A" stroke-width="1.2"/>
<text x="730" y="628" font-size="12" font-weight="700" fill="#6E1A2C">El código clave (sonido/JuegoConSonido.java)</text>
<text x="730" y="646" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">public void mover(Direccion direccion) {</text>
<text x="730" y="662" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">    EstadoJuego antes = juego.getEstado();</text>
<text x="730" y="678" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">    juego.mover(direccion);                 // 2. delega en el juego real</text>
<text x="730" y="694" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">    EstadoJuego despues = juego.getEstado();</text>
<text x="730" y="710" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">    if (antes.equals(despues)) { sonar(Sonido.CHOQUE); return; }</text>
<text x="730" y="726" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">    Sonido sonido = queSonidoCorresponde(antes, despues);   // 3.</text>
<text x="730" y="742" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">    sonar(sonido);  ...  // si se rompió una frágil y no alcanza: DERROTA</text>
<text x="730" y="758" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">}</text>
</svg>