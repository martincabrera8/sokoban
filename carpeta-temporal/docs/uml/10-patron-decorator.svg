<text x="1069.0" y="808.5" font-size="12" fill="#1E1A17" text-decoration="underline">~ queSonidoCorresponde(antes: EstadoJuego,</text>
<text x="1089.4" y="825.5" font-size="12" fill="#1E1A17" text-decoration="underline">despues: EstadoJuego): Sonido</text>
<text x="1069.0" y="842.5" font-size="12" fill="#1E1A17" text-decoration="underline">- sonar(sonido: Sonido): void</text>
</g>
<text x="860" y="553.6" font-size="10.5" font-weight="400" fill="#8A7F76" text-anchor="middle" font-style="italic">(un Juego cualquiera: hoy, JuegoSokoban)</text>
<path d="M 50 880 L 658 880 L 670 892 L 670 1008 L 50 1008 Z" fill="#FFFDF5" stroke="#B8892A" stroke-width="1.2"/>
<text x="60" y="898" font-size="12" font-weight="700" fill="#6E1A2C">Cómo se lee (seguí los números)</text>
<text x="60" y="916" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">1</tspan> El dominio y el decorador base cumplen el mismo contrato Juego.</text>
<text x="60" y="932" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">2</tspan> JuegoDecorado guarda adentro otro Juego y le pasa cada pedido (los 9).</text>
<text x="60" y="948" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">3</tspan> JuegoConSonido extiende JuegoDecorado y solo redefine lo que suena:</text>
<text x="60" y="964" font-size="11.5" fill="#1E1A17">     compara el EstadoJuego antes y después y elige el efecto.</text>
<text x="60" y="980" font-size="11.5" fill="#1E1A17">La vista y el dominio no se enteran: en Main</text>
<text x="60" y="996" font-size="11.5" fill="#1E1A17">     new JuegoConSonido(new JuegoSokoban(new CargadorNivel(carpeta)))</text>
<path d="M 720 880 L 1498 880 L 1510 892 L 1510 1040 L 720 1040 Z" fill="#FFFDF5" stroke="#B8892A" stroke-width="1.2"/>
<text x="730" y="898" font-size="12" font-weight="700" fill="#6E1A2C">El código clave (sonido/JuegoConSonido.java)</text>
<text x="730" y="916" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">public void mover(Direccion direccion) {          // JuegoConSonido</text>
<text x="730" y="932" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">    EstadoJuego antes = juego.getEstado();</text>
<text x="730" y="948" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">    juego.mover(direccion);        // 2. delega en el juego envuelto (atributo protegido)</text>
<text x="730" y="964" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">    EstadoJuego despues = juego.getEstado();</text>
<text x="730" y="980" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">    if (antes.equals(despues)) { sonar(Sonido.CHOQUE); return; }</text>
<text x="730" y="996" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">    Sonido sonido = queSonidoCorresponde(antes, despues);</text>
<text x="730" y="1012" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">    sonar(sonido);   // y si se rompió una frágil y despues.sinSolucion(): DERROTA</text>
<text x="730" y="1028" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">}</text>
</svg>