<text x="30" y="40" font-size="22" font-weight="700" fill="#6E1A2C">Patrón Decorator (estructural): el sonido</text>
<text x="30" y="62" font-size="12.5" fill="#6B6B6B">JuegoConSonido «envuelve» a otro Juego: tiene la misma interfaz, le pasa cada pedido y agrega algo (el sonido) antes o después. JuegoDecorado es la base de cualquier decorador.</text>
