<g class="caja" id="PantallaJuego">
<rect x="50" y="241" width="50.546875" height="17" rx="8.5" fill="#F6EBCF" stroke="#B8892A" stroke-width="1"/><text x="58" y="253" font-size="10.5" font-weight="600" fill="#7A5A12">Cliente</text>
<rect x="50" y="260" width="216" height="93" rx="6" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.4"/>
<text x="158.0" y="278" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1A17">PantallaJuego</text>
<text x="158.0" y="292" text-anchor="middle" font-size="10.5" fill="#7B3FA0">extiende JPanel</text>
<line x1="50" y1="299" x2="266" y2="299" stroke="#6C8EBF" stroke-width="1"/>
<text x="59.0" y="316.5" font-size="12" fill="#1E1A17">- juego: Juego</text>
