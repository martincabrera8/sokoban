<path d="M 50 704 L 2043 704 L 2055 716 L 2055 784 L 50 784 Z" fill="#FFFDF5" stroke="#B8892A" stroke-width="1.2"/>
<text x="60" y="722" font-size="12" font-weight="700" fill="#6E1A2C">Qué gana el proyecto</text>
<text x="60" y="740" font-size="11.5" fill="#1E1A17">Para la vista, mover al jugador es UNA llamada: juego.mover(Direccion.DERECHA). Atrás, JuegoSokoban le pide un recuerdo al nivel (crearRecuerdo), lo mueve (moverJugador, que usa al MotorMovimiento),</text>
<text x="60" y="756" font-size="11.5" fill="#1E1A17">guarda el recuerdo en el HistorialDeshacer, marca un punto en el tiempo si una caja llegó a destino y avisa a los observadores. <tspan font-weight="700">La vista no se entera de nada de eso.</tspan></text>
<text x="60" y="772" font-size="11.5" fill="#1E1A17">Hay otra fachada en el proyecto: <tspan font-weight="700">Sonidos</tspan>, que esconde javax.sound (diagrama 11).</text>
</svg>