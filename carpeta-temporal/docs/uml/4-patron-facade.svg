<text x="1605" y="680" font-size="10.5" font-weight="400" fill="#8A7F76" text-anchor="middle" font-style="italic">y además: Caja, las 3 estrategias, Posicion</text>
<text x="900" y="200" font-size="11" font-weight="400" fill="#7B3FA0" text-anchor="end">implementan</text>
<path d="M 50 730 L 1838 730 L 1850 742 L 1850 794 L 50 794 Z" fill="#FFFDF5" stroke="#B8892A" stroke-width="1.2"/>
<text x="60" y="748" font-size="12" font-weight="700" fill="#6E1A2C">Qué gana el proyecto</text>
<text x="60" y="766" font-size="11.5" fill="#1E1A17">Para la vista, mover al jugador es UNA llamada: juego.mover(Direccion.DERECHA). Atrás, JuegoSokoban guarda una foto para deshacer, le pide al Jugador que se mueva (y él al</text>
<text x="60" y="782" font-size="11.5" fill="#1E1A17">MotorMovimiento), suma movimientos y empujes y avisa a los observadores. <tspan font-weight="700">La vista no se entera de nada de eso.</tspan> Hay otra fachada en el proyecto: <tspan font-weight="700">Sonidos</tspan>, que esconde javax.sound (diagrama 11).</text>
</svg>