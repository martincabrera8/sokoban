<g class="caja" id="JuegoDePrueba">
<rect x="1080" y="91" width="164.75" height="17" rx="8.5" fill="#F6EBCF" stroke="#B8892A" stroke-width="1"/><text x="1088" y="103" font-size="10.5" font-weight="600" fill="#7A5A12">Fachada concreta (provisoria)</text>
