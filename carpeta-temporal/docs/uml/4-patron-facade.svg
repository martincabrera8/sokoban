<line x1="1080" y1="146" x2="1219" y2="146" stroke="#6C8EBF" stroke-width="1"/>
</g>
<g class="caja" id="ControladorJuego">
<rect x="1080" y="281" width="145.4375" height="17" rx="8.5" fill="#F6EBCF" stroke="#B8892A" stroke-width="1"/><text x="1088" y="293" font-size="10.5" font-weight="600" fill="#7A5A12">Fachada concreta (la real)</text>
<rect x="1080" y="300" width="297" height="118" rx="6" fill="#F5F5F5" stroke="#9E9E9E" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="1228.5" y="317" text-anchor="middle" font-size="10.5" fill="#6B6B6B">«pendiente»</text>
<text x="1228.5" y="332" text-anchor="middle" font-size="14" font-weight="600" fill="#6B6B6B">ControladorJuego</text>
<line x1="1080" y1="340" x2="1377" y2="340" stroke="#9E9E9E" stroke-width="1"/>
<text x="1089.0" y="357.5" font-size="12" fill="#6B6B6B">nombre provisorio · reemplaza a JuegoDePrueba</text>
<text x="1089.0" y="374.5" font-size="12" fill="#6B6B6B">tablero, jugador, cajas normal /</text>
<text x="1089.0" y="391.5" font-size="12" fill="#6B6B6B">frágil / llave, niveles .txt,</text>
<text x="1089.0" y="408.5" font-size="12" fill="#6B6B6B">deshacer 15 / 5 / 3, puntaje</text>
</g>
<g class="caja" id="Sub">
<rect x="1080" y="520" width="330" height="101" rx="6" fill="#F5F5F5" stroke="#9E9E9E" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="1245.0" y="537" text-anchor="middle" font-size="10.5" fill="#6B6B6B">«pendiente · nombres de ejemplo»</text>
<text x="1245.0" y="552" text-anchor="middle" font-size="14" font-weight="600" fill="#6B6B6B">Subsistema del dominio</text>
<line x1="1080" y1="560" x2="1410" y2="560" stroke="#9E9E9E" stroke-width="1"/>
<text x="1089.0" y="577.5" font-size="12" fill="#6B6B6B">Tablero, Jugador, Caja (normal / frágil / llave),</text>
<text x="1089.0" y="594.5" font-size="12" fill="#6B6B6B">LectorDeNiveles (.txt), Historial (deshacer),</text>
<text x="1089.0" y="611.5" font-size="12" fill="#6B6B6B">Puntaje…</text>
</g>
<text x="990" y="300" font-size="11" font-weight="400" fill="#7B3FA0" text-anchor="end">implementan</text>
<path d="M 50 620 L 938 620 L 950 632 L 950 700 L 50 700 Z" fill="#FFFDF5" stroke="#B8892A" stroke-width="1.2"/>
<text x="60" y="638" font-size="12" font-weight="700" fill="#6E1A2C">Qué gana el proyecto</text>
<text x="60" y="656" font-size="11.5" fill="#1E1A17">Para la vista, mover al jugador es UNA llamada: juego.mover(Direccion.DERECHA). La fachada real tendrá que mirar</text>
<text x="60" y="672" font-size="11.5" fill="#1E1A17">el tablero, empujar la caja, ver si es frágil o resbala, guardar el historial y sumar el puntaje. <tspan font-weight="700">La vista no se entera.</tspan></text>
<text x="60" y="688" font-size="11.5" fill="#1E1A17">Hoy JuegoDePrueba hace todo junto (no hay subsistema): el patrón <tspan font-weight="700">se termina de validar cuando llegue el dominio.</tspan></text>
</svg>