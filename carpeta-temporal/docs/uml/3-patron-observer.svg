<rect x="125.525" y="306.5" width="69.75" height="17" rx="4" fill="#FFFFFF" fill-opacity="0.95"/><text x="160.4" y="319.0" font-size="10.5" text-anchor="middle" fill="#3A332E">implementa</text><circle cx="116.525" cy="315.5" r="8.5" fill="#B8892A"/><text x="116.525" y="319.0" font-size="10" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
<path d="M 311.0 431.5 L 860.0 431.5 L 860.0 217.0" fill="none" stroke="#1E1A17" stroke-width="1.6"/>
<polyline points="854.0,228.0 860.0,217.0 866.0,228.0" fill="none" stroke="#1E1A17" stroke-width="1.6"/>
<rect x="559.78125" y="422.5" width="80.4375" height="17" rx="4" fill="#FFFFFF" fill-opacity="0.95"/><text x="600" y="435.0" font-size="10.5" text-anchor="middle" fill="#3A332E">observadores</text><circle cx="550.78125" cy="431.5" r="8.5" fill="#B8892A"/><text x="550.78125" y="435.0" font-size="10" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
<text x="876" y="240" font-size="11.5" font-weight="600" fill="#1E1A17" text-anchor="middle">*</text>
<path d="M 822.5 500.0 L 822.5 450.0 L 979.2 450.0 L 979.2 217.0" fill="none" stroke="#7B3FA0" stroke-width="1.6" stroke-dasharray="7 5"/>
<polygon points="979.2,217.0 971.2,232.0 987.2,232.0" fill="#FFFFFF" stroke="#7B3FA0" stroke-width="1.6"/>
<path d="M 1202.5 500.0 L 1202.5 450.0 L 979.2 450.0 L 979.2 217.0" fill="none" stroke="#7B3FA0" stroke-width="1.6" stroke-dasharray="7 5"/>
<polygon points="979.2,217.0 971.2,232.0 987.2,232.0" fill="#FFFFFF" stroke="#7B3FA0" stroke-width="1.6"/>
<g class="caja" id="SujetoJuego">
<rect x="60" y="111" width="95.3125" height="17" rx="8.5" fill="#F6EBCF" stroke="#B8892A" stroke-width="1"/><text x="68" y="123" font-size="10.5" font-weight="600" fill="#7A5A12">Sujeto (Subject)</text>
<rect x="60" y="130" width="355" height="101" rx="6" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.4"/>
<text x="237.5" y="147" text-anchor="middle" font-size="10.5" fill="#6B6B6B">«interface»</text>
<text x="237.5" y="162" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1A17" font-style="italic">SujetoJuego</text>
<line x1="60" y1="170" x2="415" y2="170" stroke="#6C8EBF" stroke-width="1"/>
<text x="69.0" y="187.5" font-size="12" fill="#1E1A17" font-style="italic">+ agregarObservador(observador: ObservadorJuego): void</text>
<text x="69.0" y="204.5" font-size="12" fill="#1E1A17" font-style="italic">+ quitarObservador(observador: ObservadorJuego): void</text>
<text x="69.0" y="221.5" font-size="12" fill="#1E1A17" font-style="italic">+ notificarObservadores(): void</text>
</g>
<g class="caja" id="ObservadorJuego">
<rect x="820" y="131" width="131.3125" height="17" rx="8.5" fill="#F6EBCF" stroke="#B8892A" stroke-width="1"/><text x="828" y="143" font-size="10.5" font-weight="600" fill="#7A5A12">Observador (Observer)</text>
<rect x="820" y="150" width="245" height="67" rx="6" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.4"/>
<text x="942.5" y="167" text-anchor="middle" font-size="10.5" fill="#6B6B6B">«interface»</text>
<text x="942.5" y="182" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1A17" font-style="italic">ObservadorJuego</text>
<line x1="820" y1="190" x2="1065" y2="190" stroke="#6C8EBF" stroke-width="1"/>
<text x="829.0" y="207.5" font-size="12" fill="#1E1A17" font-style="italic">+ actualizar(estado: EstadoJuego): void</text>
</g>
<g class="caja" id="JuegoSokoban">
<rect x="60" y="381" width="94.21875" height="17" rx="8.5" fill="#F6EBCF" stroke="#B8892A" stroke-width="1"/><text x="68" y="393" font-size="10.5" font-weight="600" fill="#7A5A12">Sujeto concreto</text>
<rect x="60" y="400" width="251" height="63" rx="6" fill="#FCDDC7" stroke="#C8683A" stroke-width="1.4"/>
<text x="185.5" y="418" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1A17">JuegoSokoban</text>
<line x1="60" y1="426" x2="311" y2="426" stroke="#C8683A" stroke-width="1"/>
<text x="69.0" y="443.5" font-size="12" fill="#1E1A17">- observadores: List&lt;ObservadorJuego&gt;</text>
<line x1="60" y1="453" x2="311" y2="453" stroke="#C8683A" stroke-width="1"/>
</g>
<g class="caja" id="PanelHUD">
<rect x="700" y="481" width="121.65625" height="17" rx="8.5" fill="#F6EBCF" stroke="#B8892A" stroke-width="1"/><text x="708" y="493" font-size="10.5" font-weight="600" fill="#7A5A12">Observador concreto</text>
<rect x="700" y="500" width="245" height="63" rx="6" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.4"/>
<text x="822.5" y="518" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1A17">PanelHUD</text>
<line x1="700" y1="526" x2="945" y2="526" stroke="#6C8EBF" stroke-width="1"/>
<line x1="700" y1="536" x2="945" y2="536" stroke="#6C8EBF" stroke-width="1"/>
<text x="709.0" y="553.5" font-size="12" fill="#1E1A17">+ actualizar(estado: EstadoJuego): void</text>
</g>
<g class="caja" id="PanelTablero">
<rect x="1080" y="481" width="121.65625" height="17" rx="8.5" fill="#F6EBCF" stroke="#B8892A" stroke-width="1"/><text x="1088" y="493" font-size="10.5" font-weight="600" fill="#7A5A12">Observador concreto</text>
<rect x="1080" y="500" width="245" height="63" rx="6" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.4"/>
<text x="1202.5" y="518" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1A17">PanelTablero</text>
<line x1="1080" y1="526" x2="1325" y2="526" stroke="#6C8EBF" stroke-width="1"/>
<line x1="1080" y1="536" x2="1325" y2="536" stroke="#6C8EBF" stroke-width="1"/>
<text x="1089.0" y="553.5" font-size="12" fill="#1E1A17">+ actualizar(estado: EstadoJuego): void</text>
</g>
<text x="989.25" y="330" font-size="11" font-weight="400" fill="#7B3FA0" text-anchor="start">implementan</text>
<path d="M 60 620 L 688 620 L 700 632 L 700 732 L 60 732 Z" fill="#FFFDF5" stroke="#B8892A" stroke-width="1.2"/>
<text x="70" y="638" font-size="12" font-weight="700" fill="#6E1A2C">Cómo se lee (seguí los números)</text>
<text x="70" y="656" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">1</tspan> JuegoSokoban cumple el contrato SujetoJuego (Juego lo extiende).</text>
<text x="70" y="672" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">2</tspan> Guarda la lista: agregarObservador(...) suscribe, quitarObservador(...) desuscribe.</text>
<text x="70" y="688" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">3</tspan> Después de cada cambio llama a notificarObservadores(): recorre la lista.</text>
<text x="70" y="704" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">4</tspan> Cada observador recibe una foto inmutable (EstadoJuego) y se redibuja.</text>
<text x="70" y="720" font-size="11.5" fill="#1E1A17">El sonido <tspan font-weight="700">no</tspan> es un observador: es un Decorator (diagrama 10).</text>
<path d="M 740 620 L 1448 620 L 1460 632 L 1460 748 L 740 748 Z" fill="#FFFDF5" stroke="#B8892A" stroke-width="1.2"/>
<text x="750" y="638" font-size="12" font-weight="700" fill="#6E1A2C">El código clave</text>
<text x="750" y="656" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">public void notificarObservadores() {         // JuegoSokoban</text>
<text x="750" y="672" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">    EstadoJuego estado = getEstado();</text>
<text x="750" y="688" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">    for (ObservadorJuego observador : observadores)</text>
<text x="750" y="704" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">        observador.actualizar(estado);</text>
<text x="750" y="720" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">}</text>
<text x="750" y="736" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">// PantallaJuego: juego.agregarObservador(hud); juego.agregarObservador(tablero);</text>
</svg>