<text x="910" y="330" font-size="11" font-weight="400" fill="#7B3FA0" text-anchor="start">implementan</text>
<path d="M 1000 300 L 1448 300 L 1460 312 L 1460 396 L 1000 396 Z" fill="#FFFDF5" stroke="#B8892A" stroke-width="1.2"/>
<text x="1010" y="318" font-size="12" font-weight="700" fill="#6E1A2C">¿Y el sonido?</text>
<text x="1010" y="336" font-size="11.5" fill="#1E1A17">El sonido <tspan font-weight="700">no</tspan> es un observador: es un Decorator</text>
<text x="1010" y="352" font-size="11.5" fill="#1E1A17">(ver el diagrama 10). JuegoConSonido.agregarObservador</text>
<text x="1010" y="368" font-size="11.5" fill="#1E1A17">le pasa cada observador a JuegoSokoban, que es</text>
<text x="1010" y="384" font-size="11.5" fill="#1E1A17">quien los guarda y les avisa.</text>
<path d="M 60 690 L 708 690 L 720 702 L 720 786 L 60 786 Z" fill="#FFFDF5" stroke="#B8892A" stroke-width="1.2"/>
<text x="70" y="708" font-size="12" font-weight="700" fill="#6E1A2C">Cómo se lee (seguí los números)</text>
<text x="70" y="726" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">1</tspan> JuegoSokoban cumple el contrato Juego.</text>
<text x="70" y="742" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">2</tspan> Guarda la lista de observadores que le pasan con agregarObservador(...).</text>
<text x="70" y="758" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">3</tspan> Después de cada cambio recorre la lista: obs.actualizar(foto).</text>
<text x="70" y="774" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">4</tspan> Cada observador recibe una foto inmutable (EstadoJuego) y se redibuja.</text>
<path d="M 760 690 L 1448 690 L 1460 702 L 1460 802 L 760 802 Z" fill="#FFFDF5" stroke="#B8892A" stroke-width="1.2"/>
<text x="770" y="708" font-size="12" font-weight="700" fill="#6E1A2C">El código clave (JuegoSokoban.notificar)</text>
<text x="770" y="726" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">private void notificar() {</text>
<text x="770" y="742" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">    EstadoJuego foto = getEstado();</text>
<text x="770" y="758" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">    for (ObservadorJuego obs : observadores) obs.actualizar(foto);</text>
<text x="770" y="774" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">}</text>
<text x="770" y="790" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">// Registro (PantallaJuego): juego.agregarObservador(hud); juego.agregarObservador(tablero);</text>
</svg>