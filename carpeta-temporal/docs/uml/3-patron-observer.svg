<text x="30" y="40" font-size="22" font-weight="700" fill="#6E1A2C">Patrón Observer (comportamiento)</text>
<text x="30" y="62" font-size="12.5" fill="#6B6B6B">Cuando cambia la partida, el sujeto avisa a todos los observadores; cada uno se actualiza solo. La etiqueta dorada es el ROL de la clase en el patrón.</text>
