<g class="caja" id="JuegoSokoban">
<rect x="50" y="501" width="101.984375" height="17" rx="8.5" fill="#F6EBCF" stroke="#B8892A" stroke-width="1"/><text x="58" y="513" font-size="10.5" font-weight="600" fill="#7A5A12">Arma la conexión</text>
