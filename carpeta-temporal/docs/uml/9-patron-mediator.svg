<text x="742.0" y="192" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1A17" font-style="italic">MediadorMovimiento</text>
<line x1="600" y1="200" x2="884" y2="200" stroke="#C8683A" stroke-width="1"/>
<text x="609.0" y="217.5" font-size="12" fill="#1E1A17" font-style="italic">+ intentarMover(direccion: Direccion): boolean</text>
<text x="609.0" y="234.5" font-size="12" fill="#1E1A17" font-style="italic">+ fueEmpuje(): boolean</text>
</g>
