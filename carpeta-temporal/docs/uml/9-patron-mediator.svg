<text x="30" y="40" font-size="22" font-weight="700" fill="#6E1A2C">Patrón Mediator (comportamiento): el movimiento</text>
<text x="30" y="62" font-size="12.5" fill="#6B6B6B">El Jugador no sabe nada de paredes, cajas ni hielo: le pide el movimiento a un mediador, y el mediador resuelve todo.</text>
