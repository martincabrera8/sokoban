</g>
<path d="M 50 690 L 738 690 L 750 702 L 750 834 L 50 834 Z" fill="#FFFDF5" stroke="#B8892A" stroke-width="1.2"/>
<text x="60" y="708" font-size="12" font-weight="700" fill="#6E1A2C">Cómo se lee (seguí los números)</text>
<text x="60" y="726" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">1</tspan> El Jugador guarda un MediadorMovimiento (la interfaz, no el motor).</text>
<text x="60" y="742" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">2</tspan> MotorMovimiento lo implementa y concentra las reglas: paredes, cajas,</text>
<text x="60" y="758" font-size="11.5" fill="#1E1A17">     segunda caja, hielo (la caja sigue hasta piso normal u obstáculo).</text>
<text x="60" y="774" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">3</tspan> Si hay empuje, mueve la Caja y le avisa (ahí entra el Strategy).</text>
<text x="60" y="790" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">4</tspan> Por último mueve al Jugador y devuelve true.</text>
<text x="60" y="806" font-size="11.5" fill="#1E1A17">JuegoSokoban crea un motor nuevo por nivel (y después de deshacer)</text>
<text x="60" y="822" font-size="11.5" fill="#1E1A17">y lo conecta al Jugador con conectarMotor().</text>
<path d="M 800 690 L 1578 690 L 1590 702 L 1590 802 L 800 802 Z" fill="#FFFDF5" stroke="#B8892A" stroke-width="1.2"/>
<text x="810" y="708" font-size="12" font-weight="700" fill="#6E1A2C">El código clave (entidades/Jugador.java)</text>
<text x="810" y="726" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">public boolean mover(Direccion direccion) {          // Jugador</text>
<text x="810" y="742" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">    if (mediador == null) throw new IllegalStateException(&quot;Jugador sin mediador&quot;);</text>
<text x="810" y="758" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">    return mediador.intentarMover(direccion);</text>
<text x="810" y="774" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">}</text>
<text x="810" y="790" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">// El Jugador nunca pregunta por paredes ni cajas: eso lo sabe el mediador.</text>
<path d="M 800 830 L 1578 830 L 1590 842 L 1590 910 L 800 910 Z" fill="#FFFDF5" stroke="#B8892A" stroke-width="1.2"/>
<text x="810" y="848" font-size="12" font-weight="700" fill="#6E1A2C">Para la defensa</text>
<text x="810" y="866" font-size="11.5" fill="#1E1A17">En el Mediator del libro, VARIOS colegas se hablan a través del mediador.</text>
<text x="810" y="882" font-size="11.5" fill="#1E1A17">Acá solo el Jugador le habla: la Caja no conoce al mediador (el motor la mueve).</text>
<text x="810" y="898" font-size="11.5" fill="#1E1A17">Conviene explicarlo así o hacer que la Caja también pase por el mediador.</text>
</svg>