<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 950" width="1640" height="950" font-family="Inter, Arial, sans-serif">
<style>text{white-space:pre}</style>
<rect width="1640" height="950" fill="#FFFFFF"/>
<text x="30" y="40" font-size="22" font-weight="700" fill="#6E1A2C">Patrón Mediator (comportamiento): el movimiento</text>
<text x="30" y="62" font-size="12.5" fill="#6B6B6B">Jugador y Caja no se conocen ni conocen el tablero: le hablan a un mediador, y el mediador resuelve todo.</text>
<path d="M 250.0 400.0 L 250.0 268.0" fill="none" stroke="#7B3FA0" stroke-width="1.6" stroke-dasharray="7 5"/>
<polygon points="250.0,268.0 242.0,283.0 258.0,283.0" fill="#FFFFFF" stroke="#7B3FA0" stroke-width="1.6"/>
<rect x="215.125" y="325.0" width="69.75" height="17" rx="4" fill="#FFFFFF" fill-opacity="0.95"/><text x="250.0" y="337.5" font-size="10.5" text-anchor="middle" fill="#3A332E">implementa</text><circle cx="206.125" cy="334.0" r="8.5" fill="#B8892A"/><text x="206.125" y="337.5" font-size="10" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
<path d="M 397.0 209.0 L 900.0 209.0" fill="none" stroke="#1E1A17" stroke-width="1.6"/>
<polyline points="889.0,203.0 900.0,209.0 889.0,215.0" fill="none" stroke="#1E1A17" stroke-width="1.6"/>
<polyline points="408.0,215.0 397.0,209.0 408.0,203.0" fill="none" stroke="#1E1A17" stroke-width="1.6"/>
<rect x="613.625" y="200.0" width="69.75" height="17" rx="4" fill="#FFFFFF" fill-opacity="0.95"/><text x="648.5" y="212.5" font-size="10.5" text-anchor="middle" fill="#3A332E">se conocen</text><circle cx="604.625" cy="209.0" r="8.5" fill="#B8892A"/><text x="604.625" y="212.5" font-size="10" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
<text x="884" y="203.0" font-size="11.5" font-weight="600" fill="#1E1A17" text-anchor="middle">*</text>
<path d="M 877.0 450.0 L 877.0 400.0 L 1050.5 400.0 L 1050.5 268.0" fill="none" stroke="#7B3FA0" stroke-width="1.6"/>
<polygon points="1050.5,268.0 1042.5,283.0 1058.5,283.0" fill="#FFFFFF" stroke="#7B3FA0" stroke-width="1.6"/>
<path d="M 1270.5 450.0 L 1270.5 400.0 L 1050.5 400.0 L 1050.5 268.0" fill="none" stroke="#7B3FA0" stroke-width="1.6"/>
<polygon points="1050.5,268.0 1042.5,283.0 1058.5,283.0" fill="#FFFFFF" stroke="#7B3FA0" stroke-width="1.6"/>
<g class="caja" id="MediadorMovimiento">
<rect x="120" y="131" width="117.796875" height="17" rx="8.5" fill="#F6EBCF" stroke="#B8892A" stroke-width="1"/><text x="128" y="143" font-size="10.5" font-weight="600" fill="#7A5A12">Mediador (Mediator)</text>
<rect x="120" y="150" width="277" height="118" rx="6" fill="#FCDDC7" stroke="#C8683A" stroke-width="1.4"/>
<text x="258.5" y="167" text-anchor="middle" font-size="10.5" fill="#6B6B6B">«interface»</text>
<text x="258.5" y="182" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1A17" font-style="italic">MediadorMovimiento</text>
<line x1="120" y1="190" x2="397" y2="190" stroke="#C8683A" stroke-width="1"/>
<text x="129.0" y="207.5" font-size="12" fill="#1E1A17" font-style="italic">+ intentarMover(direccion: Direccion): Evento</text>
<text x="129.0" y="224.5" font-size="12" fill="#1E1A17" font-style="italic">+ cajaDanada(caja: Caja): void</text>
<text x="129.0" y="241.5" font-size="12" fill="#1E1A17" font-style="italic">+ cajaRota(caja: Caja): void</text>
<text x="129.0" y="258.5" font-size="12" fill="#1E1A17" font-style="italic">+ llaveEmpujada(caja: Caja): void</text>
</g>
<g class="caja" id="MotorMovimiento">
<rect x="120" y="381" width="110.125" height="17" rx="8.5" fill="#F6EBCF" stroke="#B8892A" stroke-width="1"/><text x="128" y="393" font-size="10.5" font-weight="600" fill="#7A5A12">Mediador concreto</text>
<rect x="120" y="400" width="245" height="199" rx="6" fill="#FCDDC7" stroke="#C8683A" stroke-width="1.4"/>
<text x="242.5" y="418" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1A17">MotorMovimiento</text>
<line x1="120" y1="426" x2="365" y2="426" stroke="#C8683A" stroke-width="1"/>
<text x="129.0" y="443.5" font-size="12" fill="#1E1A17">- nivel: EstadoNivel</text>
<text x="129.0" y="460.5" font-size="12" fill="#1E1A17">- jugador: Jugador</text>
<text x="129.0" y="477.5" font-size="12" fill="#1E1A17">- cajas: List&lt;Caja&gt;</text>
<text x="129.0" y="494.5" font-size="12" fill="#1E1A17">- evento: Evento</text>
<line x1="120" y1="504" x2="365" y2="504" stroke="#C8683A" stroke-width="1"/>
<text x="129.0" y="521.5" font-size="12" fill="#1E1A17">+ MotorMovimiento(nivel: EstadoNivel)</text>
<text x="129.0" y="538.5" font-size="12" fill="#1E1A17">- estaLibre(posicion: Posicion): boolean</text>
<text x="129.0" y="555.5" font-size="12" fill="#1E1A17">- cajaEn(posicion: Posicion): Caja</text>
<text x="129.0" y="572.5" font-size="12" fill="#1E1A17">- deslizar(destino: Posicion,</text>
<text x="149.4" y="589.5" font-size="12" fill="#1E1A17">direccion: Direccion): Posicion</text>
</g>
<g class="caja" id="ElementoMovil">
<rect x="900" y="121" width="164.03125" height="17" rx="8.5" fill="#F6EBCF" stroke="#B8892A" stroke-width="1"/><text x="908" y="133" font-size="10.5" font-weight="600" fill="#7A5A12">Colega (Colleague, abstracta)</text>
<rect x="900" y="140" width="301" height="128" rx="6" fill="#FCDDC7" stroke="#C8683A" stroke-width="1.4"/>
<text x="1050.5" y="157" text-anchor="middle" font-size="10.5" fill="#6B6B6B">«abstract»</text>
<text x="1050.5" y="172" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1A17">ElementoMovil</text>
<line x1="900" y1="180" x2="1201" y2="180" stroke="#C8683A" stroke-width="1"/>
<text x="909.0" y="197.5" font-size="12" fill="#1E1A17"># posicion: Posicion</text>
<text x="909.0" y="214.5" font-size="12" fill="#1E1A17"># mediador: MediadorMovimiento</text>
<line x1="900" y1="224" x2="1201" y2="224" stroke="#C8683A" stroke-width="1"/>
<text x="909.0" y="241.5" font-size="12" fill="#1E1A17">+ conectar(mediador: MediadorMovimiento): void</text>
<text x="909.0" y="258.5" font-size="12" fill="#1E1A17">+ setPosicion(posicion: Posicion): void</text>
</g>
<g class="caja" id="Jugador">
<rect x="760" y="431" width="97.953125" height="17" rx="8.5" fill="#F6EBCF" stroke="#B8892A" stroke-width="1"/><text x="768" y="443" font-size="10.5" font-weight="600" fill="#7A5A12">Colega concreto</text>
<rect x="760" y="450" width="234" height="63" rx="6" fill="#FCDDC7" stroke="#C8683A" stroke-width="1.4"/>
<text x="877.0" y="468" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1A17">Jugador</text>
<line x1="760" y1="476" x2="994" y2="476" stroke="#C8683A" stroke-width="1"/>
<line x1="760" y1="486" x2="994" y2="486" stroke="#C8683A" stroke-width="1"/>
<text x="769.0" y="503.5" font-size="12" fill="#1E1A17">+ mover(direccion: Direccion): Evento</text>
</g>
<g class="caja" id="Caja">
<rect x="1180" y="431" width="97.953125" height="17" rx="8.5" fill="#F6EBCF" stroke="#B8892A" stroke-width="1"/><text x="1188" y="443" font-size="10.5" font-weight="600" fill="#7A5A12">Colega concreto</text>
<rect x="1180" y="450" width="181" height="63" rx="6" fill="#FCDDC7" stroke="#C8683A" stroke-width="1.4"/>
<text x="1270.5" y="468" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1A17">Caja</text>
<line x1="1180" y1="476" x2="1361" y2="476" stroke="#C8683A" stroke-width="1"/>
<line x1="1180" y1="486" x2="1361" y2="486" stroke="#C8683A" stroke-width="1"/>
<text x="1189.0" y="503.5" font-size="12" fill="#1E1A17">+ despuesDeEmpujar(): void</text>
</g>
<text x="413" y="201.0" font-size="11.5" font-weight="600" fill="#1E1A17" text-anchor="start">1</text>
<text x="1060.5" y="380" font-size="11" font-weight="400" fill="#7B3FA0" text-anchor="start">extienden</text>
<path d="M 50 649 L 798 649 L 810 661 L 810 825 L 50 825 Z" fill="#FFFDF5" stroke="#B8892A" stroke-width="1.2"/>
<text x="60" y="667" font-size="12" font-weight="700" fill="#6E1A2C">Cómo se lee (seguí los números)</text>
<text x="60" y="685" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">1</tspan> Jugador y Caja heredan de ElementoMovil, que guarda la posición y el mediador</text>
<text x="60" y="701" font-size="11.5" fill="#1E1A17">     (la interfaz). El mediador también los conoce a ellos: «se conocen».</text>
<text x="60" y="717" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">2</tspan> MotorMovimiento lo implementa y concentra las reglas: paredes, cajas, hielo, plutonio.</text>
<text x="60" y="733" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">3</tspan> Jugador.mover(dir) solo hace return mediador.intentarMover(dir).</text>
<text x="60" y="749" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">4</tspan> Si hay empuje, el motor mueve la Caja y le dice despuesDeEmpujar(); la estrategia</text>
<text x="60" y="765" font-size="11.5" fill="#1E1A17">     de la caja le avisa al mediador: cajaDanada, cajaRota o llaveEmpujada. El motor</text>
<text x="60" y="781" font-size="11.5" fill="#1E1A17">     quita la caja o abre los muros y anota el Evento que devuelve.</text>
<text x="60" y="797" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">Quién los conecta:</tspan> JuegoSokoban crea new MotorMovimiento(nivel) y</text>
<text x="60" y="813" font-size="11.5" fill="#1E1A17">     EstadoNivel.conectarMediador(motor) se lo pasa al jugador y a cada caja.</text>
<path d="M 860 649 L 1578 649 L 1590 661 L 1590 793 L 860 793 Z" fill="#FFFDF5" stroke="#B8892A" stroke-width="1.2"/>
<text x="870" y="667" font-size="12" font-weight="700" fill="#6E1A2C">El código clave</text>
<text x="870" y="685" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">public Evento mover(Direccion direccion) {   // Jugador</text>
<text x="870" y="701" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">    return mediador.intentarMover(direccion);</text>
<text x="870" y="717" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">}</text>
<text x="870" y="733" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">public void cajaRota(Caja caja) {            // MotorMovimiento</text>
<text x="870" y="749" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">    nivel.quitarCaja(caja);</text>
<text x="870" y="765" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">    evento = Evento.CAJA_ROTA;</text>
<text x="870" y="781" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">}</text>
<path d="M 860 799 L 1578 799 L 1590 811 L 1590 863 L 860 863 Z" fill="#FFFDF5" stroke="#B8892A" stroke-width="1.2"/>
<text x="870" y="817" font-size="12" font-weight="700" fill="#6E1A2C">Para la defensa</text>
<text x="870" y="835" font-size="11.5" fill="#1E1A17">Los colegas hablan SOLO con el mediador: ni Jugador, ni Caja, ni las estrategias</text>
<text x="870" y="851" font-size="11.5" fill="#1E1A17">conocen a EstadoNivel. Así no hay dependencias circulares.</text>
</svg>