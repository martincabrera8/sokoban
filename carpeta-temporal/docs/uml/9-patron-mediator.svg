<path d="M 50 700 L 738 700 L 750 712 L 750 876 L 50 876 Z" fill="#FFFDF5" stroke="#B8892A" stroke-width="1.2"/>
<text x="60" y="718" font-size="12" font-weight="700" fill="#6E1A2C">Cómo se lee (seguí los números)</text>
<text x="60" y="736" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">1</tspan> Los dos colegas, Jugador y Caja, guardan un MediadorMovimiento (la interfaz).</text>
<text x="60" y="752" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">2</tspan> MotorMovimiento lo implementa y concentra las reglas: paredes, cajas, hielo.</text>
<text x="60" y="768" font-size="11.5" fill="#1E1A17">     Al crearse llama a estado.conectarColegas(this): así cada colega lo conoce.</text>
<text x="60" y="784" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">3</tspan> Si hay empuje, mueve la Caja y le dice despuesDeEmpujar(). La estrategia de la</text>
<text x="60" y="800" font-size="11.5" fill="#1E1A17">     caja le avisa al mediador: cajaRota(caja) o llaveEmpujada(caja), y el motor</text>
<text x="60" y="816" font-size="11.5" fill="#1E1A17">     quita la caja o abre los muros. La Caja nunca toca el EstadoNivel.</text>
<text x="60" y="832" font-size="11.5" fill="#1E1A17"><tspan font-weight="700">4</tspan> Por último mueve al Jugador y devuelve true.</text>
<text x="60" y="848" font-size="11.5" fill="#1E1A17">JuegoSokoban crea un motor nuevo por nivel (y al deshacer o viajar en el tiempo)</text>
<text x="60" y="864" font-size="11.5" fill="#1E1A17">y lo guarda como MediadorMovimiento (depende de la interfaz).</text>
<path d="M 800 700 L 1578 700 L 1590 712 L 1590 828 L 800 828 Z" fill="#FFFDF5" stroke="#B8892A" stroke-width="1.2"/>
<text x="810" y="718" font-size="12" font-weight="700" fill="#6E1A2C">El código clave</text>
<text x="810" y="736" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">public boolean mover(Direccion direccion) {        // Jugador</text>
<text x="810" y="752" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">    return mediador.intentarMover(direccion);</text>
<text x="810" y="768" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">}</text>
<text x="810" y="784" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">caja.quitarResistencia();                         // CajaFragilStrategy</text>
<text x="810" y="800" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">if (caja.getResistencia() &lt;= 0) mediador.cajaRota(caja);</text>
<text x="810" y="816" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1E1A17">public void cajaRota(Caja caja) { estado.quitarCaja(caja); }   // MotorMovimiento</text>
<path d="M 800 870 L 1578 870 L 1590 882 L 1590 934 L 800 934 Z" fill="#FFFDF5" stroke="#B8892A" stroke-width="1.2"/>
<text x="810" y="888" font-size="12" font-weight="700" fill="#6E1A2C">Para la defensa</text>
<text x="810" y="906" font-size="11.5" fill="#1E1A17">Mediator completo (después de la auditoría): los dos colegas hablan SOLO con el mediador.</text>
<text x="810" y="922" font-size="11.5" fill="#1E1A17">Ni el Jugador ni la Caja ni las estrategias conocen a EstadoNivel: se eliminó la dependencia circular.</text>
</svg>